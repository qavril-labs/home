name: CI

# Checks only. Nothing here deploys: there are no AWS targets in the repository yet.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, tests, contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A role that can create databases and roles; each test run creates and drops its own.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Includes the contract drift test: every route must be in contracts/openapi.yaml.
      - run: npm test

  agents:
    name: Agent service (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/services/uaap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/services/uaap/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  frontend:
    name: Frontend (build, site check, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API client matches the contract
        run: |
          npm run api:generate
          git diff --exit-code -- web/src/lib/api
      - run: npx tsc --noEmit -p web
      - run: npm run build:web
      - run: npm run site:check
      - run: npm --prefix web test

  e2e:
    name: Browser tests (not blocking yet)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never run in CI before, so a failure here does not block a merge until it has been seen passing.
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
