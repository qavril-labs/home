openapi: 3.1.0
info:
  title: QAVRIL LABS ERP - Platform service
  version: 0.1.0
  description: >
    Contract for the platform service: sign-in, product entitlements, approval matrices, document
    sequences and the audit log. It owns the shared master data and the ledger; the parties, items,
    chart of accounts, ledger and approvals routes stay in openapi.yaml until the split moves them here.
    Money is a decimal string. Business dates are YYYY-MM-DD. Timestamps are UTC ISO 8601.
    Status: draft for review by the frontend lane (Antigravity). Not yet implemented.

servers:
  - url: http://localhost:3002
    description: Local development gateway
  - url: https://api.qavrillabs.com
    description: Production gateway

tags:
  - name: Products
  - name: Entitlements
  - name: Approvals
  - name: Sequences
  - name: Audit

security:
  - BearerAuth: []

paths:
  /v1/platform/products:
    get:
      tags: [Products]
      summary: List the ERP products this platform offers, with the state for the current tenant
      operationId: listProducts
      responses:
        "200":
          description: Product catalogue
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"

  /v1/platform/entitlements:
    get:
      tags: [Entitlements]
      summary: Products enabled for the current tenant (drives the launcher)
      operationId: listEntitlements
      responses:
        "200":
          description: Enabled products
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entitlement"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"

  /v1/platform/entitlements/{productKey}:
    parameters:
      - $ref: "#/components/parameters/ProductKey"
    put:
      tags: [Entitlements]
      summary: Enable or disable a product for the tenant (needs the admin permission)
      operationId: setEntitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEntitlementRequest"
      responses:
        "200":
          description: Entitlement updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlement"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/platform/approval-matrices:
    get:
      tags: [Approvals]
      summary: List approval matrices (who approves what, by value band)
      operationId: listApprovalMatrices
      parameters:
        - name: process
          in: query
          required: false
          schema:
            type: string
            example: purchase-order
      responses:
        "200":
          description: Approval matrices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalMatrix"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
    post:
      tags: [Approvals]
      summary: Create an approval matrix version
      operationId: createApprovalMatrix
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApprovalMatrixRequest"
      responses:
        "201":
          description: Matrix created (draft until activated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalMatrix"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/platform/approval-matrices/{matrixId}:
    parameters:
      - $ref: "#/components/parameters/MatrixId"
    get:
      tags: [Approvals]
      summary: Get an approval matrix version by id
      operationId: getApprovalMatrix
      responses:
        "200":
          description: Approval matrix details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalMatrix"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/platform/approval-matrices/{matrixId}/activate:
    parameters:
      - $ref: "#/components/parameters/MatrixId"
    post:
      tags: [Approvals]
      summary: Activate a matrix version; earlier versions stay for history
      operationId: activateApprovalMatrix
      responses:
        "200":
          description: Matrix active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalMatrix"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/platform/sequences:
    get:
      tags: [Sequences]
      summary: List document number sequences for the tenant and branch
      operationId: listSequences
      parameters:
        - name: branchId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sequences
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sequence"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"

  /v1/platform/sequences/{key}:
    parameters:
      - $ref: "#/components/parameters/SequenceKey"
    put:
      tags: [Sequences]
      summary: Configure or update a document number sequence prefix and starting counter
      operationId: updateSequence
      parameters:
        - name: branchId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSequenceRequest"
      responses:
        "200":
          description: Sequence updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sequence"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/platform/audit-log:
    get:
      tags: [Audit]
      summary: Read the audit trail (append-only, filtered)
      operationId: listAuditLog
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Session token. Tokens are "<tenantId>.<random>"; only a hash is stored.

  parameters:
    ProductKey:
      name: productKey
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProductKey"
    MatrixId:
      name: matrixId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SequenceKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        example: purchase-order
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Optional. Send a unique key (8 to 128 letters, digits, dots, colons, dashes or underscores)
        per submission. A retry with the same key and body returns the first response; the same key
        with a different body returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]{8,128}$"

  responses:
    UnauthenticatedError:
      description: Missing or invalid session token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The caller lacks the permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ProductKey:
      type: string
      enum: [platform, procurement, stores, sales, production, finance]

    ApprovalRole:
      type: string
      enum: [department-head, purchase-manager, finance-controller, operations-director, managing-director, board]

    Product:
      type: object
      required: [key, name, repository, status]
      properties:
        key:
          $ref: "#/components/schemas/ProductKey"
        name:
          type: string
          example: Procurement
        repository:
          type: string
          example: qavril-labs/procurement
        status:
          type: string
          enum: [available, planned]
        catalogIds:
          type: array
          items:
            type: string
          example: [PRC-01, PRC-02, PRC-03, PRC-05, PRC-06]

    Entitlement:
      type: object
      required: [productKey, enabled, updatedAt]
      properties:
        productKey:
          $ref: "#/components/schemas/ProductKey"
        enabled:
          type: boolean
        enabledAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    SetEntitlementRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    ApprovalMatrix:
      type: object
      required: [id, process, version, status, bands]
      properties:
        id:
          type: string
          format: uuid
        process:
          type: string
          example: purchase-order
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, active, retired]
        bands:
          type: array
          description: Ordered by minAmount. The band whose range holds the document value applies.
          items:
            $ref: "#/components/schemas/ApprovalBand"

    ApprovalBand:
      type: object
      required: [minAmount, steps]
      properties:
        minAmount:
          type: string
          description: Decimal string, inclusive lower bound in the document currency.
          example: "0.00"
        maxAmount:
          type: string
          nullable: true
          description: Decimal string, exclusive upper bound. Null means no upper bound.
        steps:
          type: array
          minItems: 1
          items:
            type: object
            required: [role]
            properties:
              role:
                $ref: "#/components/schemas/ApprovalRole"
              order:
                type: integer
                minimum: 1

    CreateApprovalMatrixRequest:
      type: object
      required: [process, bands]
      properties:
        process:
          type: string
        bands:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalBand"

    Sequence:
      type: object
      required: [key, prefix, nextNumber, branchId]
      properties:
        key:
          type: string
          example: purchase-order
        prefix:
          type: string
          example: PO-
        nextNumber:
          type: integer
          minimum: 1
        branchId:
          type: string
          format: uuid

    UpdateSequenceRequest:
      type: object
      properties:
        prefix:
          type: string
          example: PO-
        nextNumber:
          type: integer
          minimum: 1
          example: 1001

    AuditEntry:
      type: object
      required: [id, at, actorId, action, entityType, entityId]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
        action:
          type: string
          example: update
        entityType:
          type: string
        entityId:
          type: string
        changes:
          type: object
          additionalProperties: true

    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        nextCursor:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION
            message:
              type: string
              example: Invalid request payload
            details:
              type: array
              items:
                type: object
