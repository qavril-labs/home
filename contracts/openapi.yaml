    # ---- HRMS (HRM-01 to HRM-19). Money: decimal strings; signed for net positions. Dates: YYYY-MM-DD.
    HrmsDate:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      example: "2026-12-01"
    HrmsMoney:
      type: string
      pattern: "^-?\\d{1,13}(\\.\\d{1,3})?$"
      example: "1250.00"
      description: Decimal string in minor-unit precision for the currency. Negative only where the field says so (net positions).
    HrmsTransition:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [submit, approve, reject, hold, reopen, cancel, send, accept, decline, expire, withdraw, apply, file, calculate, verify, post, mark_paid, pay, disburse, write_off, rescind, shorten, buy_out, extend]
          description: Which transition. The resource endpoint accepts only the actions listed for it; others return VALIDATION.
        reason:
          type: string
          maxLength: 500
          description: Required for reject, decline, withdraw, write_off and rescind. Reason codes come from the reason code lists.
        reasonCode:
          type: string
          maxLength: 64
    HrmsPage:
      type: object
      description: Cursor page. nextCursor is null on the last page.
      properties:
        nextCursor: {type: string, nullable: true}

    HrmsDepartment:
      type: object
      required: [id, code, name, validFrom]
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
