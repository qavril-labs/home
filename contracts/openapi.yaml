  # ---- Procurement: orders, receipts, three-way match (PRC-01..PRC-04) ----
  /v1/procurement/orders:
    get:
      summary: List purchase orders (PRC-01)
      operationId: listPurchaseOrders
      tags: ["Procurement"]
      security:
        - BearerAuth: []
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/PurchaseOrderStatus"}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, default: 100}}
      responses:
        "200":
          description: Purchase orders, newest first
          content:
            application/json:
              schema:
                type: object
                required: [ok, orders]
                properties:
                  ok: {type: boolean}
                  orders:
                    type: array
                    items: {$ref: "#/components/schemas/PurchaseOrder"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
    post:
      summary: Create a purchase order (PRC-01)
      operationId: createPurchaseOrder
      tags: ["Procurement"]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePurchaseOrderRequest"}
      responses:
        "201":
          description: The saved order
          content:
            application/json:
              schema:
                type: object
                required: [ok, order]
                properties:
                  ok: {type: boolean}
                  order: {$ref: "#/components/schemas/PurchaseOrder"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/procurement/orders/{id}/status:
    patch:
      summary: Move a purchase order to a new status (PRC-01)
      operationId: updatePurchaseOrderStatus
      tags: ["Procurement"]
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: "#/components/schemas/PurchaseOrderStatus"}
      responses:
        "200":
          description: Status saved
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, status]
                properties:
                  ok: {type: boolean}
                  id: {type: string}
                  status: {$ref: "#/components/schemas/PurchaseOrderStatus"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/procurement/receipts:
    get:
      summary: List goods receipt notes (PRC-02)
      operationId: listGoodsReceipts
      tags: ["Procurement"]
      security:
        - BearerAuth: []
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [received, inspected, quarantined]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, default: 100}}
      responses:
        "200":
          description: Goods receipt notes, newest first
          content:
            application/json:
              schema:
                type: object
                required: [ok, receipts]
                properties:
                  ok: {type: boolean}
                  receipts:
                    type: array
                    items: {$ref: "#/components/schemas/GoodsReceiptNote"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
    post:
      summary: Record a goods receipt against a purchase order (PRC-02)
      operationId: createGoodsReceipt
      tags: ["Procurement"]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateGoodsReceiptRequest"}
      responses:
        "201":
          description: The saved receipt
          content:
            application/json:
              schema:
                type: object
                required: [ok, receipt]
                properties:
                  ok: {type: boolean}
                  receipt: {$ref: "#/components/schemas/GoodsReceiptNote"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/procurement/matches:
    get:
      summary: List three-way matches with summary counts (PRC-03)
      operationId: listThreeWayMatches
      tags: ["Procurement"]
      description: Order, receipt and supplier bill compared line by line. All figures are computed on the server.
      security:
        - BearerAuth: []
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/ThreeWayMatchStatus"}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, default: 100}}
      responses:
        "200":
          description: Matches and a summary
          content:
            application/json:
              schema:
                type: object
                required: [ok, matches, summary]
                properties:
                  ok: {type: boolean}
                  matches:
                    type: array
                    items: {$ref: "#/components/schemas/ThreeWayMatch"}
                  summary: {$ref: "#/components/schemas/ThreeWayMatchSummary"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/procurement/matches/{id}/override:
    post:
      summary: Approve a match that is outside tolerance, with a note (PRC-03)
      operationId: overrideThreeWayMatch
      tags: ["Procurement"]
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 1}
      responses:
        "200":
          description: Override recorded
          content:
            application/json:
              schema:
                type: object
                required: [ok, match]
                properties:
                  ok: {type: boolean}
                  match:
                    type: object
                    required: [id, note, overrideApproved, toleranceOk]
                    properties:
                      id: {type: string}
                      note: {type: string}
                      overrideApproved: {type: boolean}
                      toleranceOk: {type: boolean}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  # ---- Approval requests served by the API (PLT-07, AGT-01) ----
  # Not the same as /v1/approvals, which the bot service (UAAP) serves with payload-hash review.
  /v1/approval-requests:
    get:
      summary: List approval requests in the inbox (PLT-07)
      operationId: listApprovalRequests
      tags: ["Approvals"]
      security:
        - BearerAuth: []
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [all, pending, approved, rejected, executed, cancelled]}}
        - {name: botId, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        "200":
          description: Requests, newest first
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items: {$ref: "#/components/schemas/ApprovalRequest"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
    post:
      summary: Create an approval request (AGT-01)
      operationId: createApprovalRequest
      tags: ["Approvals"]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateApprovalRequestBody"}
      responses:
        "201":
          description: The request, waiting for a decision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalRequest"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/approval-requests/audit-logs:
    get:
      summary: List the agent audit log (AGT-06)
      operationId: listAgentAuditLogs
      tags: ["Approvals"]
      security:
        - BearerAuth: []
      parameters:
        - {name: botId, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items: {$ref: "#/components/schemas/AgentAuditLog"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/approval-requests/{id}:
    get:
      summary: Read one approval request (PLT-07)
      operationId: getApprovalRequest
      tags: ["Approvals"]
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalRequest"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "404":
          description: No such request in this tenant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /v1/approval-requests/{id}/approve:
    post:
      summary: Approve a request (PLT-07)
      operationId: approveApprovalRequest
      tags: ["Approvals"]
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApprovalDecisionBody"}
      responses:
        "200":
          description: The decided request. An audit entry is written.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalRequest"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "404":
          description: No such request in this tenant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /v1/approval-requests/{id}/reject:
    post:
      summary: Reject a request (PLT-07)
      operationId: rejectApprovalRequest
      tags: ["Approvals"]
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApprovalDecisionBody"}
      responses:
        "200":
          description: The decided request. An audit entry is written.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalRequest"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "404":
          description: No such request in this tenant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  # ---- Notifications: delivery state (PLT-10) ----
  /v1/notifications:
    get:
      summary: List outgoing messages and their delivery state (PLT-10)
      operationId: listNotifications
      tags: ["Notifications"]
      security:
        - BearerAuth: []
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [queued, sent, failed]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Newest first. Message bodies are not returned.
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items: {$ref: "#/components/schemas/NotificationStatus"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/notifications/{id}:
    get:
      summary: Read the delivery state of one message (PLT-10)
      operationId: getNotification
      tags: ["Notifications"]
      description: Use the notificationId returned when a reminder was sent.
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The message state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationStatus"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "404":
          description: No such message in this tenant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  # ---------------------------------------------------------------------------
  # HRMS (HRM-01 to HRM-19). Design: docs/hrms-end-to-end-design.md
  # Every operation below is marked x-planned: true. The drift gate (backend/scripts/contract-drift.mjs)
  # skips planned operations. Remove x-planned when the route ships; the gate then checks it.
  # Money is a decimal string; signed amounts are allowed for net positions.
  # ---------------------------------------------------------------------------

  /v1/hrms/dashboard:
    get:
      summary: HR dashboard KPIs and due counts (HRM-01 to HRM-18)
      operationId: hrmsGetDashboard
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      responses:
        "200":
          description: KPI tiles, each with the figure and the list it links to
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HrmsDashboard"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}

  /v1/hrms/departments:
    get:
      summary: List departments (HRM-02)
      operationId: hrmsListDepartments
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      parameters:
        - {name: asOf, in: query, required: false, schema: {$ref: "#/components/schemas/HrmsDate"}}
      responses:
        "200":
          description: Departments effective on the date
          content:
            application/json:
              schema: {type: object, required: [ok, items], properties: {ok: {type: boolean}, items: {type: array, items: {$ref: "#/components/schemas/HrmsDepartment"}}}}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}
    post:
      summary: Create a department (HRM-02)
      operationId: hrmsCreateDepartment
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmsDepartmentInput"}
      responses:
        "201":
          description: The saved department
          content:
            application/json:
              schema: {type: object, required: [ok, department], properties: {ok: {type: boolean}, department: {$ref: "#/components/schemas/HrmsDepartment"}}}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}
        "409": {$ref: "#/components/responses/ConflictError"}

  /v1/hrms/positions:
    get:
      summary: List positions with headcount (HRM-02)
      operationId: hrmsListPositions
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/HrmsPositionStatus"}}
        - {name: departmentId, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Positions, with approved and filled headcount
          content:
            application/json:
              schema: {type: object, required: [ok, items], properties: {ok: {type: boolean}, items: {type: array, items: {$ref: "#/components/schemas/HrmsPosition"}}, nextCursor: {type: string, nullable: true}}}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}
    post:
      summary: Create a position (HRM-02)
      operationId: hrmsCreatePosition
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmsPositionInput"}
      responses:
        "201":
          description: The saved position
          content:
            application/json:
              schema: {type: object, required: [ok, position], properties: {ok: {type: boolean}, position: {$ref: "#/components/schemas/HrmsPosition"}}}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}

  /v1/hrms/positions/{id}:
    patch:
      summary: "Change a position: headcount, status or reporting line (HRM-02). Rejects a reporting cycle and headcount below filled."
      operationId: hrmsUpdatePosition
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmsPositionPatch"}
      responses:
        "200":
          description: The updated position
          content:
            application/json:
              schema: {type: object, required: [ok, position], properties: {ok: {type: boolean}, position: {$ref: "#/components/schemas/HrmsPosition"}}}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}
        "404": {$ref: "#/components/responses/NotFoundError"}
        "409": {$ref: "#/components/responses/ConflictError"}

