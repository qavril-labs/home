    UaapErrorResponse:
      description: Bot API error envelope. Unlike ErrorResponse above, details is an object and request_id is always present.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, request_id]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - VALIDATION
                - NOT_FOUND
                - CONFLICT
                - APPROVAL_ALREADY_CONSUMED
                - APPROVAL_EXPIRED
                - APPROVAL_REQUIRED
                - IDEMPOTENCY_CONFLICT
                - TOOL_BLOCKED
                - RATE_LIMITED
                - QUOTA_EXCEEDED
                - UPSTREAM_FAILED
                - UPSTREAM_TIMEOUT
                - UPSTREAM_INVALID_RESPONSE
                - INTERNAL
            message:
              type: string
              example: "Approval not found"
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
              example: "req_8a21c4d9e0f1"

    AgentList:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentSummary"

    AgentSummary:
      type: object
      required: [agent_id, name, purpose, enabled, use_cases, out_of_scope]
      properties:
        agent_id:
          type: string
          example: "universal-finance-agent"
        name:
          type: string
          example: "Universal Finance Agent"
        purpose:
          type: string
        enabled:
          type: boolean
        use_cases:
          type: array
          items:
            type: object
            required: [title, example]
            properties:
              title:
                type: string
              example:
                type: string
        out_of_scope:
          type: array
          items:
            type: string

    AgentMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 20000
          example: "What does the trial balance look like as of 2026-11-30?"
        company_id:
          type: string
          format: uuid
          description: The company the request is about. Bots that need one refuse without it.
        today:
          type: string
          format: date
          description: Business date (YYYY-MM-DD). Defaults to today in UTC.

    AgentReply:
      type: object
      required: [status, text, run_id, approval, error_code, guardrail_events, data]
      properties:
        status:
          type: string
          enum: [answered, awaiting_approval, needs_clarification, refused, failed]
          description: >
            answered: the reply is final. awaiting_approval: a proposal is in the inbox.
            needs_clarification: ask the user for the missing input shown in text.
            refused: out of scope or the bot is switched off. failed: nothing was done; text says why.
        text:
          type: string
          description: The message to show the user. Figures from the ledger are quoted from the ledger, never written by the model.
        run_id:
          type: string
          nullable: true
        approval:
          type: object
          nullable: true
          description: Present when status is awaiting_approval. The approval token is never included.
          required: [approval_id, summary, expires_at]
          properties:
            approval_id:
              type: string
            summary:
              type: string
            expires_at:
              type: string
              format: date-time
        error_code:
          type: string
          nullable: true
          description: Set when status is failed or refused. Use it to choose the message to show.
        guardrail_events:
          type: array
          items:
            type: string
            enum:
              - INPUT_EMPTY
              - INPUT_TOO_LONG
              - PII_REDACTED
              - INJECTION_SUSPECTED
              - UNGROUNDED_FIGURE
              - UNGROUNDED_IDENTIFIER
              - UNGROUNDED_REPLY
              - OUT_OF_SCOPE
        data:
          type: object
          additionalProperties: true
          description: Structured result from the ledger when there is one, for example the trial balance rows.

    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, FAILED, EXPIRED]

    Approval:
      type: object
      required: [approval_id, run_id, agent_id, initiator_id, action, summary, payload, payload_hash, created_at, expires_at, status, can_decide, decided_by, decided_at, outcome]
      properties:
        approval_id:
          type: string
        run_id:
          type: string
        agent_id:
          type: string
        initiator_id:
          type: string
        action:
          type: string
          example: "ledger_post_journal_entry"
        summary:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: The exact action the approver is asked to confirm.
        payload_hash:
          type: string
          description: SHA-256 of the payload. Send it back to approve.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        can_decide:
          type: boolean
          description: False for the person who proposed the action, and once the proposal is decided or expired.
        decided_by:
          type: string
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        outcome:
          type: string
          nullable: true

    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        payload_hash:
          type: string
          minLength: 64
          maxLength: 64
          description: Required to approve. Must match the payload_hash shown on the proposal.
        reason:
          type: string
          maxLength: 500
          description: Optional, for rejections.

    ApprovalDecisionResponse:
      type: object
      required: [approval, reply]
      properties:
        approval:
          $ref: "#/components/schemas/Approval"
        reply:
