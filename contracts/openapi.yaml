        partyId: {type: string, format: uuid}
        partyName: {type: string}
        partyTaxId: {type: string, nullable: true}
        invoiceNumber: {type: string}
        issueDate: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        dueDate: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        currency: {type: string}
        status: {type: string, enum: [draft, issued, sent, partially_paid, paid, overdue, void]}
        subtotal: {type: string, pattern: '^\d{1,13}(\.\d{1,2})?$'}
        taxTotal: {type: string, pattern: '^\d{1,13}(\.\d{1,2})?$'}
        total: {type: string, pattern: '^\d{1,13}(\.\d{1,2})?$'}
        amountPaid: {type: string, pattern: '^\d{1,13}(\.\d{1,2})?$'}
        balanceDue: {type: string, pattern: '^\d{1,13}(\.\d{1,2})?$'}
        paymentTerms: {type: string, nullable: true}
        notes: {type: string, nullable: true}
        metadata: {type: object, additionalProperties: true}
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLine"
        postingStatus:
          type: string
          enum: [NOT_POSTED, PENDING, POSTED, FAILED]
          description: >
            Whether the invoice is in the books (the ledger). Issued invoices are queued (PENDING) in the
            same transaction as the invoice and posted by the worker, so POSTED can lag by seconds. FAILED
            means the posting was refused; postingError says why. NOT_POSTED covers drafts, invoices
            created already paid, and invoices from before posting existed.
        ledgerEntryId: {type: string, nullable: true, description: "Journal entry the invoice was posted as; null until POSTED."}
        postingError: {type: string, nullable: true, description: "Plain-language reason when postingStatus is FAILED."}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
