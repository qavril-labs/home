          description: Own balances
          content:
            application/json:
              schema: {type: object, required: [ok, items], properties: {ok: {type: boolean}, items: {type: array, items: {$ref: "#/components/schemas/HrmsLeaveBalance"}}}}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/hrms/me/exit-tasks:
    get:
      summary: Own clearance tasks during notice (HRM-18, HRM-07)
