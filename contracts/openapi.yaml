        departmentId: {type: string}
        gradeCode: {type: string, nullable: true}
        reportsToPositionId: {type: string, nullable: true}
        approvedHeadcount: {type: integer, minimum: 0}
        budgetedAnnualCost: {$ref: "#/components/schemas/HrmsMoney"}
        currency: {type: string, minLength: 3, maxLength: 3}
