openapi: 3.1.0
info:
  title: QAVRIL LABS Platform API
  version: 1.0.0
  description: >
    The HTTP contract between the frontend web app/marketing site and the backend core services.
    Every figure on screen comes from these endpoints. Money amounts are always formatted decimal strings.

servers:
  - url: http://localhost:3002
    description: Local development API server
  - url: https://api.qavrillabs.com
    description: Production API

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                required:
                  - status

  /v1/public/leads:
    post:
      summary: Submit marketing site lead or demo request
      operationId: submitLead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadSubmission"
      responses:
        "201":
          description: Lead received successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "received"
                required:
                  - status
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /v1/public/signup:
    post:
      summary: Self-service workspace sign-up
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: Workspace provisioned and owner signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /v1/auth/login:
    post:
      summary: Sign in with workspace credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /v1/auth/logout:
    post:
      summary: Sign out and invalidate current session
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Successfully signed out

  /v1/me:
    get:
      summary: Get current authenticated principal and permissions
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal:
                    $ref: "#/components/schemas/Principal"
                required:
                  - principal
        "401":
          $ref: "#/components/responses/UnauthenticatedError"

  /v1/workspace/overview:
    get:
      summary: Get signed-in workspace dashboard figures, totals, and monthly trends
      operationId: getWorkspaceOverview
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Full workspace ledger overview and metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceOverview"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /v1/workspace/insights:
    get:
      summary: Get autonomous bot findings and draft actions for workspace
      operationId: getWorkspaceInsights
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Bot crew findings and recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInsights"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"

  /v1/workspace/starter-books:
    post:
      summary: Open starter chart of accounts and initial fiscal year
      operationId: setUpStarterBooks
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Books opened successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"

  /v1/workspace/quick-entries:
    post:
      summary: Post a double-entry journal transaction from plain user inputs
      operationId: postQuickEntry
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickEntryRequest"
      responses:
        "201":
          description: Transaction recorded into ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickEntryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"

  /v1/master-data/parties:
    get:
      summary: List customers and suppliers (MDM-01)
      operationId: listParties
      security:
        - BearerAuth: []
      parameters:
        - name: partyType
          in: query
          schema:
            type: string
            enum: ["customer", "supplier", "both"]
        - name: status
          in: query
          schema:
            type: string
            enum: ["active", "hold", "archived", "inactive"]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Party listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Party"
    post:
      summary: Create a new customer or supplier
      operationId: createParty
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePartyRequest"
      responses:
        "201":
          description: Party created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "400":
          $ref: "#/components/responses/ValidationError"

  /v1/master-data/parties/{id}:
    get:
      summary: Get party details
      operationId: getParty
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Party details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "404":
          description: Party not found
    put:
      summary: Update party details
      operationId: updateParty
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePartyRequest"
      responses:
        "200":
          description: Party updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
    delete:
      summary: Delete or archive party
      operationId: deleteParty
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Party deleted

  /v1/master-data/items:
    get:
      summary: List inventory items and goods/services catalog (MDM-02)
      operationId: listItems
      security:
        - BearerAuth: []
      parameters:
        - name: itemType
          in: query
          schema:
            type: string
            enum: ["goods", "service", "bundle"]
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Item listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductItem"
    post:
      summary: Create a catalog or inventory item
      operationId: createItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductItem"
        "400":
          $ref: "#/components/responses/ValidationError"

  /v1/master-data/items/{id}:
    get:
      summary: Get item details
      operationId: getItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductItem"
    put:
      summary: Update item details
      operationId: updateItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductItem"
    delete:
      summary: Delete item
      operationId: deleteItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Item deleted

  /v1/master-data/accounts:
    get:
      summary: List chart of accounts (MDM-03)
      operationId: listMasterDataAccounts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      summary: Create an account in the chart of accounts
      operationId: createMasterDataAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /v1/master-data/accounts/{code}:
    put:
      summary: Update account name or status (MDM-03)
      operationId: updateMasterDataAccount
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                active:
                  type: boolean
              required:
                - name
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /v1/ledger/accounts:
    get:
      summary: List chart of accounts for company
      operationId: listAccounts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      summary: Create a new account
      operationId: createAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /v1/ledger/entries:
    get:
      summary: List ledger journal entries
      operationId: listEntries
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Journal entry list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      summary: Post a balanced double-entry journal
      operationId: postJournalEntry
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostJournalRequest"
      responses:
        "201":
          description: Entry posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /v1/ledger/entries/{id}/reverse:
    post:
      summary: Post an immutable reversal of a journal entry
      operationId: reverseJournalEntry
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                memo:
                  type: string
      responses:
        "201":
          description: Reversal entry posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /v1/ledger/trial-balance:
    get:
      summary: Retrieve trial balance as of date
      operationId: getTrialBalance
      security:
        - BearerAuth: []
      parameters:
        - name: asOf
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Trial balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialBalance"

  /v1/hrms/dashboard:
    get:
      summary: HR dashboard KPIs (HRM-01..HRM-19)
      responses:
        "200":
          description: HR dashboard KPIs
  /v1/hrms/org/tree:
    get:
      summary: Org reports-to tree (HRM-02)
      responses:
        "200":
          description: Org tree
  /v1/hrms/org/departments:
    get:
      summary: Departments list (HRM-02)
      responses:
        "200":
          description: Departments
    post:
      summary: Create a department (HRM-02)
      operationId: hrmsCreateDepartment
      tags:
      - HRMS
      x-planned: true
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HrmsDepartmentInput'
      responses:
        '201':
          description: The saved department
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - department
                properties:
                  ok:
                    type: boolean
                  department:
                    $ref: '#/components/schemas/HrmsDepartment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /v1/hrms/org/positions:
    get:
      summary: Positions list (HRM-02)
      responses:
        "200":
          description: Positions
    post:
      summary: Create a position (HRM-02)
      operationId: hrmsCreatePosition
      tags:
      - HRMS
      x-planned: true
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HrmsPositionInput'
      responses:
        '201':
          description: The saved position
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - position
                properties:
                  ok:
                    type: boolean
                  position:
                    $ref: '#/components/schemas/HrmsPosition'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /v1/hrms/headcount-plan:
    get:
      summary: Headcount plan by department and period (HRM-16)
      responses:
        "200":
          description: Headcount plan
  /v1/hrms/requisitions:
    get:
      summary: Requisitions list (HRM-16)
      responses:
        "200":
          description: Requisitions
    post:
      summary: Create requisition (HRM-16)
      responses:
        "201":
          description: Requisition created
  /v1/hrms/requisitions/{id}/approve:
    post:
      summary: Approve requisition (HRM-16)
      responses:
        "200":
          description: Requisition approved
  /v1/hrms/recruitment/applications:
    get:
      summary: Candidate applications (HRM-09)
      responses:
        "200":
          description: Applications
    post:
      summary: Apply a candidate to a requisition (HRM-09)
      operationId: hrmsCreateApplication
      tags:
      - HRMS
      x-planned: true
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HrmsApplicationInput'
      responses:
        '201':
          description: The application
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - application
                properties:
                  ok:
                    type: boolean
                  application:
                    $ref: '#/components/schemas/HrmsApplication'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /v1/hrms/offers:
    get:
      summary: Offers list (HRM-09)
      responses:
        "200":
          description: Offers
    post:
      summary: Draft an offer. The band check is computed by the server against approved pay bands (HRM-13).
      operationId: hrmsCreateOffer
      tags:
      - HRMS
      x-planned: true
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HrmsOfferInput'
      responses:
        '201':
          description: The draft offer with band status
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - offer
                properties:
                  ok:
                    type: boolean
                  offer:
                    $ref: '#/components/schemas/HrmsOffer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /v1/hrms/employees:
    get:
      summary: Employee directory (HRM-01)
      responses:
        "200":
          description: Employees
  /v1/hrms/employees/{id}/reveal-pii:
    post:
      summary: Audited PII reveal (HRM-01)
      responses:
        "200":
          description: PII revealed and audited
  /v1/hrms/lifecycle-events:
    get:
      summary: Lifecycle events queue (HRM-17)
      responses:
        "200":
          description: Lifecycle events
    post:
      summary: Record lifecycle event (HRM-17)
      responses:
        "201":
          description: Lifecycle event recorded
  /v1/hrms/attendance:
    get:
      summary: Attendance days (HRM-03)
      responses:
        "200":
          description: Attendance days
  /v1/hrms/leave/balances:
    get:
      summary: Leave balances in half-day units (HRM-04)
      responses:
        "200":
          description: Leave balances
  /v1/hrms/leave/requests:
    get:
      summary: Leave requests (HRM-04)
      responses:
        "200":
          description: Leave requests
    post:
      summary: Submit leave request (HRM-04)
      responses:
        "201":
          description: Leave request submitted
  /v1/hrms/payroll/runs:
    get:
      summary: Pay runs list (HRM-05)
      responses:
        "200":
          description: Pay runs
    post:
      summary: Create a pay run draft for a period (HRM-05)
      operationId: hrmsCreatePayRun
      tags:
      - HRMS
      x-planned: true
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HrmsPayRunInput'
      responses:
        '201':
          description: The draft pay run
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - payRun
                properties:
                  ok:
                    type: boolean
                  payRun:
                    $ref: '#/components/schemas/HrmsPayRun'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /v1/hrms/payroll/payslips:
    get:
      summary: Posted payslips (HRM-05)
      responses:
        "200":
          description: Payslips
  /v1/hrms/statutory/filings:
    get:
      summary: Statutory filing calendar (HRM-06)
      responses:
        "200":
          description: Statutory filings
  /v1/hrms/onboarding/tasks:
    get:
      summary: Onboarding checklist (HRM-10)
      responses:
        "200":
          description: Onboarding tasks
  /v1/hrms/compliance/expiries:
    get:
      summary: Compliance expiries 30/60/90d (HRM-14)
      responses:
        "200":
          description: Compliance expiries
  /v1/hrms/separations:
    get:
      summary: Exit cases and F&F (HRM-18)
      responses:
        "200":
          description: Exit cases
    post:
      summary: Start an exit case (HRM-18). Notice terms are computed from the employment's policy.
      operationId: hrmsCreateExitCase
      tags:
      - HRMS
      x-planned: true
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HrmsExitCaseInput'
      responses:
        '201':
          description: The exit case
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - exitCase
                properties:
                  ok:
                    type: boolean
                  exitCase:
                    $ref: '#/components/schemas/HrmsExitCase'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /v1/hrms/loans:
    get:
      summary: Loans and advances (HRM-19)
      responses:
        "200":
          description: Loans
    post:
      summary: Request loan (HRM-19)
      responses:
        "201":
          description: Loan requested
  /v1/hrms/self-service/summary:
    get:
      summary: Employee self-service summary (HRM-07)
      responses:
        "200":
          description: Self-service summary

  /v1/hrms/recruitment/rejection-reasons:
    get:
      summary: List rejection reason codes (HRM-09)
      responses:
        "200":
          description: Rejection reason codes

  /v1/hrms/recruitment/applications/{id}/stage:
    patch:
      summary: Move an application to a stage (HRM-09)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Application after the stage move

  /v1/hrms/recruitment/applications/{id}/scorecards:
    post:
      summary: Submit a scorecard (HRM-09)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Scorecard saved
    get:
      summary: List scorecards for an application (HRM-09). Scores by other panel members are returned only once the caller has submitted their own.
      operationId: hrmsListScorecards
      tags:
      - HRMS
      x-planned: true
      security:
