        "201":
          description: The pending request
          content:
            application/json:
              schema: {type: object, required: [ok, request], properties: {ok: {type: boolean}, request: {$ref: "#/components/schemas/HrmsProfileChangeRequest"}}}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
