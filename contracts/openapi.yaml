        costCenterCode: {type: string, nullable: true, description: FIN-08 dimension}
        validFrom: {$ref: "#/components/schemas/HrmsDate"}
        validTo: {$ref: "#/components/schemas/HrmsDate", nullable: true}
    HrmsDepartmentInput:
      type: object
      required: [code, name, validFrom]
      properties:
        code: {type: string, maxLength: 32}
        name: {type: string, maxLength: 120}
        parentId: {type: string, nullable: true}
        costCenterCode: {type: string, nullable: true}
        validFrom: {$ref: "#/components/schemas/HrmsDate"}

    HrmsPositionStatus:
      type: string
      enum: [open, filled, frozen, closed]
    HrmsPosition:
      type: object
      required: [id, code, title, departmentId, status, approvedHeadcount, filledHeadcount]
