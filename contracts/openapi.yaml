        "201":
          description: The requested loan with its schedule
          content:
            application/json:
              schema: {type: object, required: [ok, loan], properties: {ok: {type: boolean}, loan: {$ref: "#/components/schemas/HrmsLoan"}}}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}
        "404": {$ref: "#/components/responses/NotFoundError"}
        "409": {$ref: "#/components/responses/ConflictError"}

  /v1/hrms/loans/{id}/transitions:
    post:
      summary: Approve, disburse or write off a loan (HRM-19). Disbursement can happen once.
      operationId: hrmsTransitionLoan
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmsTransition"}
      responses:
        "200":
          description: The loan after the transition
          content:
            application/json:
              schema: {type: object, required: [ok, loan], properties: {ok: {type: boolean}, loan: {$ref: "#/components/schemas/HrmsLoan"}}}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}
        "404": {$ref: "#/components/responses/NotFoundError"}
        "409": {$ref: "#/components/responses/ConflictError"}

  /v1/hrms/me/profile:
    get:
      summary: The signed-in employee's own profile (HRM-07)
      operationId: hrmsGetMyProfile
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Own profile
          content:
            application/json:
              schema: {type: object, required: [ok, employee], properties: {ok: {type: boolean}, employee: {$ref: "#/components/schemas/HrmsEmployee"}}}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "404": {$ref: "#/components/responses/NotFoundError"}

  /v1/hrms/me/profile-change-requests:
    post:
      summary: Request a change to own contact or address details (HRM-07). Applied after the manager or HR approves.
      operationId: hrmsCreateMyProfileChangeRequest
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmsProfileChangeInput"}
