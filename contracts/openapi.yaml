      type: object
      required: [bills]
      properties:
        bills:
          type: array
          items:
            $ref: "#/components/schemas/Bill"

    FiscalPeriodsResponse:
      type: object
      required: [periods]
      properties:
        periods:
          type: array
          items:
            type: object
            required: [id, startDate, endDate, status]
            properties:
              id: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}
              startDate: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
              endDate: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
              status: {type: string, enum: [OPEN, CLOSED]}
    RateSavedResponse:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [saved]}
    TenantProvisionedResponse:
      type: object
      required: [tenant, company, admin]
      properties:
        tenant: {type: object, additionalProperties: true, description: Slug, name, region, status}
        company: {type: object, additionalProperties: true}
        admin: {type: object, additionalProperties: true, description: The first user, with the tenant_admin role. No password.}
    TenantProductsResponse:
      type: object
      required: [tenantId, products]
      properties:
        tenantId: {type: string, format: uuid}
        products:
          type: array
          items: {type: string}
    StreamTicket:
      type: object
      required: [ticket, expiresInSeconds]
      properties:
        ticket: {type: string, minLength: 30}
        expiresInSeconds: {type: integer, enum: [60]}

    PurchaseOrderStatus:
      type: string
      enum: [draft, issued, partially_received, received, billed, closed, cancelled]
    PurchaseOrderLine:
      type: object
      required: [sku, description, quantityOrdered, unitPrice]
      properties:
        id: {type: string}
        itemId: {type: string}
        sku: {type: string}
        description: {type: string}
        quantityOrdered: {type: number, exclusiveMinimum: 0}
        unitPrice: {type: string, description: "Decimal string, up to two places.", example: "12.50"}
        lineTotal: {type: string}
    PurchaseOrder:
      type: object
      required: [id, supplierId, supplierName, orderDate, expectedDeliveryDate, status, currency, total, lines]
      properties:
        id: {type: string}
        supplierId: {type: string}
        supplierName: {type: string}
        orderDate: {type: string, format: date}
        expectedDeliveryDate: {type: string, format: date}
        status: {$ref: "#/components/schemas/PurchaseOrderStatus"}
        currency: {type: string, example: "USD"}
        total: {type: string}
        notes: {type: string, nullable: true}
        approvedBy: {type: string, nullable: true}
        lines:
          type: array
          items: {$ref: "#/components/schemas/PurchaseOrderLine"}
    CreatePurchaseOrderRequest:
      type: object
      required: [supplierId, supplierName, orderDate, expectedDeliveryDate, lines]
      properties:
        id: {type: string}
        supplierId: {type: string}
        supplierName: {type: string}
        orderDate: {type: string, format: date}
        expectedDeliveryDate: {type: string, format: date}
        status: {$ref: "#/components/schemas/PurchaseOrderStatus"}
        currency: {type: string}
        total: {type: string}
        notes: {type: string}
        approvedBy: {type: string}
        lines:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/PurchaseOrderLine"}
    GoodsReceiptLine:
      type: object
      required: [sku, description, quantityReceived, warehouseId, warehouseName]
      properties:
        id: {type: string}
        poLineId: {type: string}
        sku: {type: string}
        description: {type: string}
        quantityReceived: {type: number, exclusiveMinimum: 0}
        quantityRejected: {type: number, minimum: 0}
        batchLotNumber: {type: string}
        warehouseId: {type: string}
        warehouseName: {type: string}
    GoodsReceiptNote:
      type: object
      required: [id, poId, poRef, supplierId, supplierName, receivedBy, status, lines]
      properties:
        id: {type: string}
        poId: {type: string}
        poRef: {type: string}
        supplierId: {type: string}
        supplierName: {type: string}
        receiptDate: {type: string, format: date}
        receivedBy: {type: string}
        status: {type: string, enum: [received, inspected, quarantined]}
        carrier: {type: string, nullable: true}
        trackingNumber: {type: string, nullable: true}
        notes: {type: string, nullable: true}
        lines:
          type: array
          items: {$ref: "#/components/schemas/GoodsReceiptLine"}
    CreateGoodsReceiptRequest:
      type: object
      required: [poId, poRef, supplierId, supplierName, receivedBy, lines]
      properties:
        id: {type: string}
        poId: {type: string}
        poRef: {type: string}
        supplierId: {type: string}
        supplierName: {type: string}
        receiptDate: {type: string}
        receivedBy: {type: string}
        status: {type: string, enum: [received, inspected, quarantined]}
        carrier: {type: string}
        trackingNumber: {type: string}
        notes: {type: string}
        lines:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/GoodsReceiptLine"}
    ThreeWayMatchStatus:
      type: string
      enum: [MATCHED, PRICE_VARIANCE, QUANTITY_VARIANCE, UNMATCHED_GRN, UNMATCHED_BILL]
    ThreeWayMatch:
      type: object
      required: [id, poId, poRef, grnId, grnRef, billId, billRef, supplierName, sku, orderedQty, receivedQty, billedQty, agreedUnitPrice, billedUnitPrice, poTotal, billTotal, qtyVariance, priceVariance, status, toleranceOk, overrideApproved]
      properties:
        id: {type: string}
        poId: {type: string}
        poRef: {type: string}
        grnId: {type: string}
        grnRef: {type: string}
        billId: {type: string}
        billRef: {type: string}
        supplierName: {type: string}
        sku: {type: string}
        description: {type: string}
        orderedQty: {type: number}
        receivedQty: {type: number}
        billedQty: {type: number}
        agreedUnitPrice: {type: string}
        billedUnitPrice: {type: string}
        poTotal: {type: string}
        billTotal: {type: string}
        qtyVariance: {type: number}
        priceVariance: {type: string}
        status: {$ref: "#/components/schemas/ThreeWayMatchStatus"}
        toleranceOk: {type: boolean}
        overrideApproved: {type: boolean}
        overrideNote: {type: string, nullable: true}
        overrideBy: {type: string, nullable: true}
    ThreeWayMatchSummary:
      type: object
      required: [totalItems, matchedCount, varianceCount, unmatchedCount, totalValueUnderReview]
      properties:
        totalItems: {type: integer}
        matchedCount: {type: integer}
        varianceCount: {type: integer}
        unmatchedCount: {type: integer}
        totalValueUnderReview: {type: string, description: "Decimal string; bills not yet matched or inside tolerance."}

    ApprovalRequest:
      type: object
      required: [id, botId, botName, actionType, title, summary, currency, riskLevel, status, payload, confidenceScore, requestedAt]
      properties:
        id: {type: string}
        botId: {type: string}
        botName: {type: string}
        actionType: {type: string}
        title: {type: string}
        summary: {type: string}
        amount: {type: string, nullable: true, description: "Decimal string."}
        currency: {type: string}
        riskLevel: {type: string, enum: [low, medium, high, critical]}
        status: {type: string, enum: [pending, approved, rejected, executed, cancelled]}
        payload: {type: object, additionalProperties: true}
        confidenceScore: {type: number}
        requestedAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time, nullable: true}
        decidedBy: {type: string, nullable: true}
        decisionReason: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateApprovalRequestBody:
      type: object
      required: [botId, botName, actionType, title, summary]
      properties:
        id: {type: string}
        botId: {type: string}
        botName: {type: string}
        actionType: {type: string}
        title: {type: string}
        summary: {type: string}
        amount: {type: string, nullable: true}
        currency: {type: string}
        riskLevel: {type: string, enum: [low, medium, high, critical]}
        payload: {type: object, additionalProperties: true}
        confidenceScore: {type: number}
    ApprovalDecisionBody:
      type: object
      properties:
        reason: {type: string}
    AgentAuditLog:
      type: object
      required: [id, botId, eventType, action, entityType, entityId, details, createdAt]
      properties:
        id: {type: string}
        botId: {type: string}
        eventType: {type: string}
        action: {type: string}
        entityType: {type: string}
        entityId: {type: string}
        details: {type: object, additionalProperties: true}
        hashChain: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}

    NotificationStatus:
      type: object
      required: [id, channel, templateKey, toAddress, subject, status, attempts]
      properties:
        id: {type: string}
        channel: {type: string, enum: [email]}
        templateKey: {type: string}
        toAddress: {type: string}
        subject: {type: string}
        status: {type: string, enum: [queued, sent, failed], description: "sent means the provider accepted it. Bounces are not tracked yet."}
        attempts: {type: integer}
        providerMessageId: {type: string, nullable: true}
        error: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        sentAt: {type: string, format: date-time, nullable: true}
