  # ---- Procurement: orders, receipts, three-way match (PRC-01..PRC-04) ----
  /v1/procurement/orders:
    get:
      summary: List purchase orders (PRC-01)
      operationId: listPurchaseOrders
      tags: ["Procurement"]
      security:
        - BearerAuth: []
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/PurchaseOrderStatus"}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, default: 100}}
      responses:
        "200":
          description: Purchase orders, newest first
          content:
            application/json:
              schema:
                type: object
                required: [ok, orders]
                properties:
                  ok: {type: boolean}
                  orders:
                    type: array
                    items: {$ref: "#/components/schemas/PurchaseOrder"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
    post:
      summary: Create a purchase order (PRC-01)
      operationId: createPurchaseOrder
      tags: ["Procurement"]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePurchaseOrderRequest"}
      responses:
        "201":
          description: The saved order
          content:
            application/json:
              schema:
                type: object
                required: [ok, order]
                properties:
                  ok: {type: boolean}
                  order: {$ref: "#/components/schemas/PurchaseOrder"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/procurement/orders/{id}/status:
    patch:
      summary: Move a purchase order to a new status (PRC-01)
      operationId: updatePurchaseOrderStatus
      tags: ["Procurement"]
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: "#/components/schemas/PurchaseOrderStatus"}
      responses:
        "200":
          description: Status saved
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, status]
                properties:
                  ok: {type: boolean}
                  id: {type: string}
                  status: {$ref: "#/components/schemas/PurchaseOrderStatus"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/procurement/receipts:
    get:
      summary: List goods receipt notes (PRC-02)
      operationId: listGoodsReceipts
      tags: ["Procurement"]
      security:
        - BearerAuth: []
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [received, inspected, quarantined]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, default: 100}}
      responses:
        "200":
          description: Goods receipt notes, newest first
          content:
            application/json:
              schema:
                type: object
                required: [ok, receipts]
                properties:
                  ok: {type: boolean}
                  receipts:
                    type: array
                    items: {$ref: "#/components/schemas/GoodsReceiptNote"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
    post:
      summary: Record a goods receipt against a purchase order (PRC-02)
      operationId: createGoodsReceipt
      tags: ["Procurement"]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateGoodsReceiptRequest"}
      responses:
        "201":
          description: The saved receipt
          content:
            application/json:
              schema:
                type: object
                required: [ok, receipt]
                properties:
                  ok: {type: boolean}
                  receipt: {$ref: "#/components/schemas/GoodsReceiptNote"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/procurement/matches:
    get:
      summary: List three-way matches with summary counts (PRC-03)
      operationId: listThreeWayMatches
      tags: ["Procurement"]
      description: Order, receipt and supplier bill compared line by line. All figures are computed on the server.
      security:
        - BearerAuth: []
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/ThreeWayMatchStatus"}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, default: 100}}
      responses:
        "200":
          description: Matches and a summary
          content:
            application/json:
              schema:
                type: object
                required: [ok, matches, summary]
                properties:
                  ok: {type: boolean}
                  matches:
                    type: array
                    items: {$ref: "#/components/schemas/ThreeWayMatch"}
                  summary: {$ref: "#/components/schemas/ThreeWayMatchSummary"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/procurement/matches/{id}/override:
    post:
      summary: Approve a match that is outside tolerance, with a note (PRC-03)
      operationId: overrideThreeWayMatch
      tags: ["Procurement"]
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, minLength: 1}
      responses:
        "200":
          description: Override recorded
          content:
            application/json:
              schema:
                type: object
                required: [ok, match]
                properties:
                  ok: {type: boolean}
                  match:
                    type: object
                    required: [id, note, overrideApproved, toleranceOk]
                    properties:
                      id: {type: string}
                      note: {type: string}
                      overrideApproved: {type: boolean}
                      toleranceOk: {type: boolean}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  # ---- Approval requests served by the API (PLT-07, AGT-01) ----
  # Not the same as /v1/approvals, which the bot service (UAAP) serves with payload-hash review.
  /v1/approval-requests:
    get:
      summary: List approval requests in the inbox (PLT-07)
      operationId: listApprovalRequests
      tags: ["Approvals"]
      security:
        - BearerAuth: []
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [all, pending, approved, rejected, executed, cancelled]}}
        - {name: botId, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        "200":
          description: Requests, newest first
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items: {$ref: "#/components/schemas/ApprovalRequest"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
    post:
      summary: Create an approval request (AGT-01)
      operationId: createApprovalRequest
      tags: ["Approvals"]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateApprovalRequestBody"}
      responses:
        "201":
          description: The request, waiting for a decision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalRequest"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/approval-requests/audit-logs:
    get:
      summary: List the agent audit log (AGT-06)
      operationId: listAgentAuditLogs
      tags: ["Approvals"]
      security:
        - BearerAuth: []
      parameters:
        - {name: botId, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items: {$ref: "#/components/schemas/AgentAuditLog"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/approval-requests/{id}:
    get:
      summary: Read one approval request (PLT-07)
      operationId: getApprovalRequest
      tags: ["Approvals"]
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The request
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalRequest"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "404":
          description: No such request in this tenant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /v1/approval-requests/{id}/approve:
    post:
      summary: Approve a request (PLT-07)
      operationId: approveApprovalRequest
      tags: ["Approvals"]
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApprovalDecisionBody"}
      responses:
        "200":
          description: The decided request. An audit entry is written.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalRequest"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "404":
          description: No such request in this tenant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /v1/approval-requests/{id}/reject:
    post:
      summary: Reject a request (PLT-07)
      operationId: rejectApprovalRequest
      tags: ["Approvals"]
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApprovalDecisionBody"}
      responses:
        "200":
          description: The decided request. An audit entry is written.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ApprovalRequest"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "404":
          description: No such request in this tenant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  # ---- Notifications: delivery state (PLT-10) ----
  /v1/notifications:
    get:
      summary: List outgoing messages and their delivery state (PLT-10)
      operationId: listNotifications
      tags: ["Notifications"]
      security:
        - BearerAuth: []
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [queued, sent, failed]}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Newest first. Message bodies are not returned.
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items: {$ref: "#/components/schemas/NotificationStatus"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}

  /v1/notifications/{id}:
    get:
      summary: Read the delivery state of one message (PLT-10)
      operationId: getNotification
      tags: ["Notifications"]
      description: Use the notificationId returned when a reminder was sent.
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The message state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationStatus"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "404":
          description: No such message in this tenant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token issued by /v1/auth/login. Only its hash is stored server-side.
    AdminKey:
      type: apiKey
      in: header
      name: x-admin-key
      description: Operator key for the CMS admin routes.

  parameters:
    TenantHeader:
      name: X-Tenant-ID
      in: header
      required: true
      description: The tenant the caller belongs to. Must match the tenant in the bearer token.
      schema:
        type: string
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        example: "appr_3f9a1c2b4d5e"


  responses:
    UaapError:
      description: Request refused (see error.code)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UaapErrorResponse"
    UaapUnauthenticatedError:
      description: Missing, invalid or expired session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UaapErrorResponse"

    ValidationError:
      description: Invalid input parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthenticatedError:
      description: Authentication required or token expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Action not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimitedError:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION"
            message:
              type: string
              example: "Invalid request payload"
            details:
              type: array
              items:
                type: object
          required:
            - code
            - message
      required:
        - error

    LeadSubmission:
      type: object
      properties:
        name:
          type: string
          example: "Alex Vance"
        email:
          type: string
          format: email
          example: "alex@vancetools.com"
        company:
          type: string
          example: "Vance Tools Ltd"
        country:
          type: string
          example: "United States"
        interest:
          type: string
          enum: ["early_access", "demo", "partner", "trial"]
        industry:
          type: string
          example: "Manufacturing"
        message:
          type: string
        source:
          type: string
        slot:
          type: string
        timezone:
          type: string
        consent:
          type: boolean
          enum: [true]
        website:
          type: string
          description: "Honeypot field; must remain empty"
      required:
        - name
        - email
        - interest
        - consent

    SignUpRequest:
      type: object
      properties:
        workspace:
          type: string
          example: "apex-tools"
        companyName:
          type: string
          example: "Apex Precision Tools Ltd"
        country:
          type: string
          example: "US"
        currency:
          type: string
          example: "USD"
        name:
          type: string
          example: "Sarah Connor"
        email:
          type: string
          format: email
          example: "sarah@apexprecision.com"
        password:
          type: string
          format: password
        website:
          type: string
          description: "Honeypot field"
      required:
        - workspace
        - companyName
        - country
        - currency
        - name
        - email
        - password

    SignUpResponse:
      type: object
      properties:
        workspace:
          type: string
        tenantId:
          type: string
        company:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        session:
          $ref: "#/components/schemas/SessionInfo"
      required:
        - workspace
        - tenantId
        - company
        - session

    LoginRequest:
      type: object
      properties:
        tenantSlug:
          type: string
          example: "apex-tools"
        email:
          type: string
          format: email
          example: "sarah@apexprecision.com"
        password:
          type: string
          format: password
      required:
        - tenantSlug
        - email
        - password

    SessionInfo:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - token
        - expiresAt

    SessionResponse:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/SessionInfo"
        principal:
          $ref: "#/components/schemas/Principal"
      required:
        - session
        - principal

    Principal:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        email:
          type: string
        permissions:
          type: array
          items:
            type: string
      required:
        - id
        - tenantId
        - email
        - permissions

    WorkspaceTotals:
      type: object
      properties:
        cash:
          type: string
          example: "42150.00"
        revenue:
          type: string
          example: "128420.50"
        expenses:
          type: string
          example: "86270.50"
        profit:
          type: string
          example: "42150.00"
      required:
        - cash
        - revenue
        - expenses
        - profit

    MonthlyTrendRow:
      type: object
      properties:
        month:
          type: string
          example: "2026-11"
        revenue:
          type: string
          example: "23500.00"
        expenses:
          type: string
          example: "10100.00"
      required:
        - month
        - revenue
        - expenses

    WorkspaceOverview:
      type: object
      properties:
        company:
          type: object
          properties:
            name:
              type: string
            currency:
              type: string
        workspace:
          type: object
          properties:
            slug:
              type: string
        asOf:
          type: string
          format: date
        booksReady:
          type: boolean
        totals:
          $ref: "#/components/schemas/WorkspaceTotals"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyTrendRow"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/RecentEntry"
      required:
        - company
        - workspace
        - asOf
        - booksReady
        - totals
        - trend

    BotInsight:
      type: object
      properties:
        id:
          type: string
          example: "lou"
        name:
          type: string
          example: "Ledger Lou"
        role:
          type: string
          example: "Month-end checker"
        color:
          type: string
          example: "cyan"
        status:
          type: string
          enum: ["good", "watch", "act", "idle"]
        statusText:
          type: string
          example: "All good"
        foundText:
          type: string
        nextText:
          type: string
        hasDraft:
          type: boolean
        draftType:
          type: string
        draftLabel:
          type: string
        actionVerb:
          type: string
      required:
        - id
        - name
        - role
        - color
        - status
        - statusText
        - foundText
        - nextText

    WorkspaceInsights:
      type: object
      properties:
        company:
          type: string
        workspaceName:
          type: string
        currency:
          type: string
        asOf:
          type: string
        totals:
          $ref: "#/components/schemas/WorkspaceTotals"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyTrendRow"
        bots:
          type: array
          items:
            $ref: "#/components/schemas/BotInsight"
      required:
        - company
        - workspaceName
        - currency
        - asOf
        - totals
        - trend
        - bots

    QuickEntryRequest:
      type: object
      properties:
        kind:
          type: string
          enum: ["sale", "expense", "owner_investment", "customer_payment"]
        amount:
          type: string
          pattern: "^\\d{1,13}(\\.\\d{1,3})?$"
          example: "1250.00"
        date:
          type: string
          format: date
          example: "2026-11-14"
        account:
          type: string
          example: "4000"
        via:
          type: string
          enum: ["1000", "1100", "1200", "2000"]
          example: "1100"
        memo:
          type: string
          example: "Custom Machining Batch #42"
      required:
        - kind
        - amount
        - date
        - via

    QuickEntryResponse:
      type: object
      properties:
        reference:
          type: string
          example: "QE-2026-00042"
        date:
          type: string
        amount:
          type: string
      required:
        - reference

    Account:
      type: object
      properties:
        code:
          type: string
          example: "1100"
        name:
          type: string
          example: "Operating Bank Account"
        type:
          type: string
          enum: ["ASSET", "LIABILITY", "EQUITY", "REVENUE", "EXPENSE"]
        balance:
          type: string
          example: "42150.00"
      required:
        - code
        - name
        - type

    CreateAccountRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: ["ASSET", "LIABILITY", "EQUITY", "REVENUE", "EXPENSE"]
      required:
        - code
        - name
        - type

    JournalLine:
      type: object
      properties:
        account:
          type: string
        side:
          type: string
          enum: ["DEBIT", "CREDIT"]
        amount:
          type: string
      required:
        - account
        - side
        - amount

    JournalEntry:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
        date:
          type: string
          format: date
        memo:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JournalLine"
        reversalOf:
          type: string
      required:
        - id
        - reference
        - date
        - lines

    PostJournalRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        reference:
          type: string
        memo:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JournalLine"
      required:
        - date
        - lines

    TrialBalance:
      type: object
      properties:
        asOf:
          type: string
          format: date
        balanced:
          type: boolean
        debitTotal:
          type: string
        creditTotal:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
      required:
        - asOf
        - balanced
        - debitTotal
        - creditTotal
        - accounts

    RecentEntry:
      type: object
      properties:
        id:
          type: string
          example: "ENT-1049"
        date:
          type: string
          example: "2026-11-14"
        kind:
          type: string
          example: "Sale"
        description:
          type: string
          example: "Batch CNC Work"
        party:
          type: string
          example: "Delta Dynamics"
        amount:
          type: string
          example: "3450.00"
        status:
          type: string
          example: "posted"
      required:
        - id
        - date
        - kind
        - description
        - amount
        - status

    Party:
      type: object
      properties:
        id:
          type: string
          example: "01932940-1284-7a32-9842-192847583920"
        name:
          type: string
          example: "Delta Dynamics LLC"
        partyType:
          type: string
          enum: ["customer", "supplier", "both"]
        email:
          type: string
          example: "billing@deltadynamics.com"
        phone:
          type: string
          example: "+1 555-019-2831"
        taxId:
          type: string
          example: "US-8492019"
        status:
          type: string
          enum: ["active", "hold", "archived", "inactive"]
          example: "active"
        balance:
          type: string
          example: "3450.00"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - partyType
        - status
        - balance

    CreatePartyRequest:
      type: object
      properties:
        name:
          type: string
          example: "Delta Dynamics LLC"
        partyType:
          type: string
          enum: ["customer", "supplier", "both"]
        email:
          type: string
        phone:
          type: string
        taxId:
          type: string
        status:
          type: string
          enum: ["active", "hold", "archived", "inactive"]
        balance:
          type: string
      required:
        - name
        - partyType

    UpdatePartyRequest:
      type: object
      properties:
        name:
          type: string
        partyType:
          type: string
          enum: ["customer", "supplier", "both"]
        email:
          type: string
        phone:
          type: string
        taxId:
          type: string
        status:
          type: string
          enum: ["active", "hold", "archived", "inactive"]

    ProductItem:
      type: object
      properties:
        id:
          type: string
          example: "01932940-9912-7a11-8842-102938475619"
        sku:
          type: string
          example: "TOOL-CNC-01"
        name:
          type: string
          example: "Carbide End Mill 1/2 in 4-Flute"
        itemType:
          type: string
          enum: ["goods", "service", "bundle"]
          example: "goods"
        category:
          type: string
          example: "Tooling"
        unit:
          type: string
          example: "pcs"
        unitPrice:
          type: string
          example: "48.50"
        stockQuantity:
          type: integer
          example: 42
        reorderPoint:
          type: integer
          example: 20
        status:
          type: string
          enum: ["in_stock", "low_stock", "out_of_stock", "discontinued"]
          example: "in_stock"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - sku
        - name
        - itemType
        - unit
        - unitPrice
        - stockQuantity
        - reorderPoint
        - status

    CreateItemRequest:
      type: object
      properties:
        sku:
          type: string
          example: "TOOL-CNC-01"
        name:
          type: string
          example: "Carbide End Mill 1/2 in 4-Flute"
        itemType:
          type: string
          enum: ["goods", "service", "bundle"]
        category:
          type: string
        unit:
          type: string
          default: "pcs"
        unitPrice:
          type: string
          example: "48.50"
        stockQuantity:
          type: integer
          default: 0
        reorderPoint:
          type: integer
          default: 0
        status:
          type: string
          enum: ["in_stock", "low_stock", "out_of_stock", "discontinued"]
      required:
        - sku
        - name

    UpdateItemRequest:
      type: object
      properties:
        name:
          type: string
        itemType:
          type: string
          enum: ["goods", "service", "bundle"]
        category:
          type: string
        unit:
          type: string
        unitPrice:
          type: string
        stockQuantity:
          type: integer
        reorderPoint:
          type: integer
        status:
          type: string
          enum: ["in_stock", "low_stock", "out_of_stock", "discontinued"]
    UaapErrorResponse:
      description: Bot API error envelope. Unlike ErrorResponse above, details is an object and request_id is always present.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, request_id]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - VALIDATION
                - NOT_FOUND
                - CONFLICT
                - APPROVAL_ALREADY_CONSUMED
                - APPROVAL_EXPIRED
                - APPROVAL_REQUIRED
                - IDEMPOTENCY_CONFLICT
                - TOOL_BLOCKED
                - RATE_LIMITED
                - QUOTA_EXCEEDED
                - UPSTREAM_FAILED
                - UPSTREAM_TIMEOUT
                - UPSTREAM_INVALID_RESPONSE
                - INTERNAL
            message:
              type: string
              example: "Approval not found"
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
              example: "req_8a21c4d9e0f1"

    AgentList:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentSummary"

    AgentSummary:
      type: object
      required: [agent_id, name, purpose, enabled, use_cases, out_of_scope]
      properties:
        agent_id:
          type: string
          example: "universal-finance-agent"
        name:
          type: string
          example: "Universal Finance Agent"
        purpose:
          type: string
        enabled:
          type: boolean
        use_cases:
          type: array
          items:
            type: object
            required: [title, example]
            properties:
              title:
                type: string
              example:
                type: string
        out_of_scope:
          type: array
          items:
            type: string

    AgentMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 20000
          example: "What does the trial balance look like as of 2026-11-30?"
        company_id:
          type: string
          format: uuid
          description: The company the request is about. Bots that need one refuse without it.
        today:
          type: string
          format: date
          description: Business date (YYYY-MM-DD). Defaults to today in UTC.

    AgentReply:
      type: object
      required: [status, text, run_id, approval, error_code, guardrail_events, data]
      properties:
        status:
          type: string
          enum: [answered, awaiting_approval, needs_clarification, refused, failed]
          description: >
            answered: the reply is final. awaiting_approval: a proposal is in the inbox.
            needs_clarification: ask the user for the missing input shown in text.
            refused: out of scope or the bot is switched off. failed: nothing was done; text says why.
        text:
          type: string
          description: The message to show the user. Figures from the ledger are quoted from the ledger, never written by the model.
        run_id:
          type: string
          nullable: true
        approval:
          type: object
          nullable: true
          description: Present when status is awaiting_approval. The approval token is never included.
          required: [approval_id, summary, expires_at]
          properties:
            approval_id:
              type: string
            summary:
              type: string
            expires_at:
              type: string
              format: date-time
        error_code:
          type: string
          nullable: true
          description: Set when status is failed or refused. Use it to choose the message to show.
        guardrail_events:
          type: array
          items:
            type: string
            enum:
              - INPUT_EMPTY
              - INPUT_TOO_LONG
              - PII_REDACTED
              - INJECTION_SUSPECTED
              - UNGROUNDED_FIGURE
              - UNGROUNDED_IDENTIFIER
              - UNGROUNDED_REPLY
              - OUT_OF_SCOPE
        data:
          type: object
          additionalProperties: true
          description: Structured result from the ledger when there is one, for example the trial balance rows.

    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, FAILED, EXPIRED]

    Approval:
      type: object
      required: [approval_id, run_id, agent_id, initiator_id, action, summary, payload, payload_hash, created_at, expires_at, status, can_decide, decided_by, decided_at, outcome]
      properties:
        approval_id:
          type: string
        run_id:
          type: string
        agent_id:
          type: string
        initiator_id:
          type: string
        action:
          type: string
          example: "ledger_post_journal_entry"
        summary:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: The exact action the approver is asked to confirm.
        payload_hash:
          type: string
          description: SHA-256 of the payload. Send it back to approve.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        can_decide:
          type: boolean
          description: False for the person who proposed the action, and once the proposal is decided or expired.
        decided_by:
          type: string
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        outcome:
          type: string
          nullable: true

    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        payload_hash:
          type: string
          minLength: 64
          maxLength: 64
          description: Required to approve. Must match the payload_hash shown on the proposal.
        reason:
          type: string
          maxLength: 500
          description: Optional, for rejections.

    ApprovalDecisionResponse:
      type: object
      required: [approval, reply]
      properties:
        approval:
          $ref: "#/components/schemas/Approval"
        reply:
          $ref: "#/components/schemas/AgentReply"

