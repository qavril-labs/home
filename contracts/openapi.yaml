openapi: 3.0.3
info:
  title: QAVRIL LABS ERP API
  version: 0.2.0
  description: |
    Contract for the backend HTTP API. Claude Code writes this file; Antigravity reviews every change.
    Amounts are decimal strings in the company's currency. Business dates are YYYY-MM-DD.
    Errors use the body { "error": { "code", "message", "details" } }.
servers:
  - url: http://127.0.0.1:3002
paths:
  /v1/sales/invoices:
    post:
      summary: Issue a sales invoice (SAL-04)
      description: |
        Assigns the next INV-YYYY-NNNNNN number, posts receivables, income and tax to the ledger,
        and stores the invoice in one transaction. Needs permission sal.invoices.write and the
        FIN-01 and SAL-04 products enabled.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInvoice"
      responses:
        "201":
          description: Issued invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    get:
      summary: List invoices with money still owed
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Open invoices, oldest number first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/sales/invoices/{number}:
    get:
      summary: Get one invoice
      parameters:
        - $ref: "#/components/parameters/InvoiceNumber"
        - $ref: "#/components/parameters/CompanyId"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          $ref: "#/components/responses/Error"
  /v1/sales/invoices/{number}/payments:
    post:
      summary: Record a payment against an invoice
      description: |
        Debits the bank account and credits receivables. A payment above the amount outstanding
        is refused with the amount still owed in details.outstanding. Needs sal.invoices.pay.
      parameters:
        - $ref: "#/components/parameters/InvoiceNumber"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPayment"
      responses:
        "201":
          description: The invoice after the payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/sales/invoices/{number}/void:
    post:
      summary: Void an invoice that has no payments
      description: Posts a reversal of the invoice entry. Needs sal.invoices.void.
      parameters:
        - $ref: "#/components/parameters/InvoiceNumber"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidInvoice"
      responses:
        "200":
          description: The voided invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "409":
          $ref: "#/components/responses/Error"
  /v1/master/parties:
    get:
      summary: List parties of a company (MDM-01)
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Parties, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Party"
    post:
      summary: Create a customer, supplier or both (MDM-01)
      description: Needs permission mdm.parties.write. A duplicate tax ID in the company is refused.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartyInput"
      responses:
        "201":
          description: The party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/master/parties/{id}/deactivate:
    post:
      summary: Deactivate a party (MDM-01)
      description: Documents that already refer to it keep working. New invoices to it are refused.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              properties:
                companyId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The deactivated party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "404":
          $ref: "#/components/responses/Error"
  /v1/master/items:
    get:
      summary: List items of a company (MDM-02)
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Items, by code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
    post:
      summary: Create an item (MDM-02)
      description: Needs permission mdm.items.write. The code is stored in upper case and must be unique in the company.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: The item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/sales/invoices/{number}/credit-notes:
    post:
      summary: Credit part or all of an invoice (SAL-04)
      description: |
        Posts the lines back to income and tax and debits receivables. The credit cannot be more
        than the amount still owed. Needs permission sal.invoices.credit.
      parameters:
        - $ref: "#/components/parameters/InvoiceNumber"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditNoteInput"
      responses:
        "201":
          description: The credit note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditNote"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/sales/credit-notes/{number}:
    get:
      summary: Get one credit note
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CompanyId"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The credit note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditNote"
        "404":
          $ref: "#/components/responses/Error"
  /v1/sales/quotes:
    post:
      summary: Create a quote (SAL-04)
      description: A quote posts nothing to the ledger. It gets a QUO- number. Needs permission sal.quotes.write.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: The quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/Error"
  /v1/sales/quotes/{number}:
    get:
      summary: Get one quote
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CompanyId"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          $ref: "#/components/responses/Error"
  /v1/sales/quotes/{number}/accept:
    post:
      summary: Accept a quote into an invoice
      description: Issues an invoice with the same lines. The quote becomes ACCEPTED. A second acceptance is refused.
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptQuote"
      responses:
        "201":
          description: The invoice issued from the quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "409":
          $ref: "#/components/responses/Error"
  /v1/sales/quotes/{number}/cancel:
    post:
      summary: Cancel an open quote
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              properties:
                companyId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The cancelled quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "409":
          $ref: "#/components/responses/Error"
  /v1/sales/invoices/{number}/trace:
    get:
      summary: Trace an invoice to the ledger entries behind every figure
      description: |
        Lists the issue entry, each payment, each credit note and the void, with the lines of each entry
        and the account name for each line. Needs permission fin.report.read.
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CompanyId"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The invoice and the entries behind it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceTrace"
        "404":
          $ref: "#/components/responses/Error"
  /v1/approvals:
    get:
      summary: List approval requests
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, WITHDRAWN]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Requests, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalRequest"
    post:
      summary: Ask for an approval (PLT-07)
      description: |
        Holds a sensitive action until a second person decides. The reason is required and is shown to the
        approver. Needs permission approvals.request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "201":
          description: The pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/approvals/{id}/approve:
    post:
      summary: Approve a request
      description: The requester cannot approve their own request. Needs permission approvals.decide.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: The approved request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/approvals/{id}/reject:
    post:
      summary: Reject a request
      description: A rejection needs a note of at least five characters, so the requester knows what to change.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: The rejected request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/approvals/{id}/withdraw:
    post:
      summary: Withdraw your own pending request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: The withdrawn request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "403":
          $ref: "#/components/responses/Error"
  /v1/inventory/receipts:
    post:
      summary: Receive stock into a new batch (INV-01, INV-03)
      description: |
        Records a receipt as a batch with its expiry date and unit cost, and posts its value to the ledger as
        debit stock on hand, credit goods received not invoiced. A repeat of the same reference returns the
        batch it made. Quantities are whole units sent as decimal strings. Needs permission inv.stock.receive
        and the FIN-01, INV-01 and INV-03 products.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockReceiptInput"
      responses:
        "201":
          description: The batch, with its balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockBatch"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/inventory/issues:
    post:
      summary: Issue stock, first to expire first (INV-03 FEFO)
      description: |
        Takes the quantity from the batches that expire first, never from expired batches, and never below
        zero. Posts the cost as debit cost of goods sold, credit stock on hand. A repeat of the same reference
        returns what the first attempt took. Needs permission inv.stock.issue.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockIssueInput"
      responses:
        "201":
          description: The batches taken, their cost and the ledger entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockResult"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          description: Not enough unexpired stock. Nothing is taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /v1/inventory/write-offs:
    post:
      summary: Request a write-off of expired stock (INV-03). Carried out only when a second person approves.
      description: |
        Asks for a write-off of the batches that expired before the date. Nothing moves when it is requested.
        The approval queue holds it as an INVENTORY_WRITE_OFF request. When a second person approves it, the
        expired batches are written off, the cost is posted as debit write-off expense and credit stock on hand,
        and the approval response carries the outcome in its effect. The requester cannot approve it. Asking when
        nothing has expired is refused with 409. Needs permission inv.stock.writeoff.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteOffInput"
      responses:
        "202":
          description: The pending approval request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/inventory/batches:
    get:
      summary: List batches with their balances (INV-03)
      description: Each batch with its balance, derived from its movements. Needs permission inv.report.read.
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: item
          in: query
          required: false
          schema:
            type: string
        - name: warehouse
          in: query
          required: false
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Batches in receipt order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockBatch"
  /v1/inventory/expiry:
    get:
      summary: Pharmacy expiry report (INV-03)
      description: |
        Batches still on hand that have already expired, and those expiring within the window, with days left
        and the cost of the stock at risk. Needs permission inv.report.read.
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: asOf
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
            example: "2026-03-15"
        - name: withinDays
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 3650
            default: 30
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The expiry report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpiryReport"
        "400":
          $ref: "#/components/responses/Error"
  /v1/pos/sales/sync:
    post:
      summary: Sync point-of-sale sales from a device (POS-01)
      description: |
        Takes a batch of sales, which a device may have made offline. Each sale is priced, its payment checked,
        its stock taken first to expire first, and then posted with a receipt number and a ledger entry. A sale
        that cannot be posted as it stands (a short payment, or not enough unexpired stock) is kept as
        NEEDS_REVIEW with its reasons and moves no stock. A sale already synced is returned as stored, so a
        retried batch never posts twice. A malformed or refused sale is returned as REJECTED and not stored, so
        the device keeps it. Each sale is handled on its own. Needs permission pos.sale.record and the POS-01,
        INV-01, INV-03 and FIN-01 products.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosSyncInput"
      responses:
        "200":
          description: One result per sale, in the order sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosSyncResult"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/pos/sales:
    get:
      summary: List point-of-sale sales (POS-01)
      description: |
        Pass status=NEEDS_REVIEW with pending=true to see the sales nobody has decided yet. Each sale carries its
        resolution once it has been decided. Needs permission pos.sale.read.
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [POSTED, NEEDS_REVIEW]
        - name: pending
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sales, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosSale"
  /v1/inventory/transfers:
    post:
      summary: Move stock between warehouses (INV-02)
      description: |
        Moves the quantity from the source warehouse, first to expire first, and creates matching batches in the
        destination with the same batch number, expiry date and unit cost. A transfer posts no ledger entry, because
        both warehouses sit under the same stock account. A repeat of the same reference returns what the first
        attempt moved. Needs permission inv.stock.transfer.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: The batches the stock left, and the quantity moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResult"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/inventory/counts:
    get:
      summary: List stock counts (INV-09)
      description: |
        Counts of the company. The expected quantities are shown only to people with inv.count.review, and only
        once a count is no longer open, so the count is taken blind. Needs permission inv.count.manage.
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Counts, each with its lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockCount"
    post:
      summary: Start a stock count of a warehouse (INV-09)
      description: |
        Starts a count of every batch in the warehouse, with the expected quantities frozen at the start. Only one
        count per warehouse can be open at a time. The expected quantities are withheld from the counter. Needs
        permission inv.count.manage.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountInput"
      responses:
        "201":
          description: The open count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCount"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/inventory/counts/{id}/lines:
    post:
      summary: Record what was counted in one batch
      description: Counting the same batch again replaces the figure. Only an open count can change. Needs permission inv.count.manage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountLineInput"
      responses:
        "200":
          description: The count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCount"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/inventory/counts/{id}/submit:
    post:
      summary: Submit a count for approval (INV-09)
      description: |
        Every batch must have a counted quantity. The count is then held for a second person. Its adjustments are
        posted only when that person approves the STOCK_COUNT_APPLY request. A rejected or withdrawn request returns
        the count to the counter. Needs permission inv.count.manage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CountSubmitInput"
      responses:
        "202":
          description: The submitted count and the pending approval request
          content:
            application/json:
              schema:
                type: object
                required: [count, approval]
                properties:
                  count:
                    $ref: "#/components/schemas/StockCount"
                  approval:
                    $ref: "#/components/schemas/ApprovalRequest"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/inventory/counts/{id}/cancel:
    post:
      summary: Cancel an open count
      description: A count that is submitted or applied cannot be cancelled. Needs permission inv.count.manage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyBody"
      responses:
        "200":
          description: The cancelled count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCount"
        "409":
          $ref: "#/components/responses/Error"
  /v1/inventory/imports/receipts:
    post:
      summary: Import goods received or opening stock from a CSV file (INV-01)
      description: |
        The CSV is the raw request body (text/csv). Its first row names the columns: warehouse, item, batch_no,
        expires_on (may be empty), qty, unit_cost, date, reference. Other columns are ignored. The import is a dry
        run unless dryRun=false. A file with any bad row is not imported. An import that writes must move the stock
        account by exactly the value of the batches it created, or it is rolled back. A repeated import creates
        nothing. Accounts are named in the query. Needs permission inv.stock.import.
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - name: dryRun
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
            default: "true"
        - name: inventory
          in: query
          required: true
          schema:
            type: string
        - name: clearing
          in: query
          required: true
          schema:
            type: string
        - name: cogs
          in: query
          required: true
          schema:
            type: string
        - name: writeOff
          in: query
          required: true
          schema:
            type: string
        - name: countVariance
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The report, with the reconciliation of the stock account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/pos/sales/{id}/review:
    post:
      summary: Decide a sale that was kept for review (POS-01)
      description: |
        POST posts the sale now, against current stock, with the payments as reconciled (or as recorded) and on
        a date in an open period. If it still cannot be posted, nothing is written and the response is 409 with the
        reasons. VOID records that the sale will never be posted. A sale can be decided once. Needs permission
        pos.sale.review.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosReviewInput"
      responses:
        "200":
          description: The sale and its decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReviewResult"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: The sale was already decided or posted, or it still cannot be posted (reasons listed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReviewResult"
  /v1/companies:
    get:
      summary: The companies of the signed-in tenant
      description: Lets a client choose which company its screens work on. Needs a session; no permission.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The companies, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [companies]
                properties:
                  companies:
                    type: array
                    items:
                      type: object
                      required: [id, legalName, countryCode, baseCurrency, fiscalYearStartMonth]
                      properties:
                        id:
                          type: string
                          format: uuid
                        legalName:
                          type: string
                        countryCode:
                          type: string
                        baseCurrency:
                          type: string
                        fiscalYearStartMonth:
                          type: integer
        "401":
          $ref: "#/components/responses/Error"
  /v1/pos/sales/price:
    post:
      summary: Price a sale in progress, without writing anything (POS-01)
      description: |
        Gives the totals, the change owed, and the problems that would send this sale to review, using the same
        rules as posting a sale. Tenders may be empty while the cashier is still entering them. Nothing is stored
        and no stock moves. Needs permission pos.sale.record and the POS-01, INV-01, INV-03 and FIN-01 products.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosPriceInput"
      responses:
        "200":
          description: The priced sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosPriceResult"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CompanyId:
      name: companyId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    InvoiceNumber:
      name: number
      in: path
      required: true
      schema:
        type: string
        maxLength: 60
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: NOT_LICENSED
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    IssueInvoice:
      type: object
      required: [companyId, customerId, date, currency, receivableAccount, lines]
      properties:
        companyId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          description: An active party with kind CUSTOMER or BOTH in the same company.
        date:
          type: string
          format: date
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        receivableAccount:
          type: string
          description: Ledger account code for receivables, for example 1200.
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceLine"
    InvoiceLine:
      type: object
      required: [description, revenueAccount, amount]
      properties:
        description:
          type: string
        revenueAccount:
          type: string
        amount:
          type: string
          description: Net amount of the line, positive, decimal string.
        taxAccount:
          type: string
          description: Required when tax is above zero.
        tax:
          type: string
          description: Tax on the line, zero or positive, decimal string.
    RecordPayment:
      type: object
      required: [companyId, date, amount, bankAccount, receivableAccount]
      properties:
        companyId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        amount:
          type: string
        bankAccount:
          type: string
        receivableAccount:
          type: string
    VoidInvoice:
      type: object
      required: [companyId, date, receivableAccount]
      properties:
        companyId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        receivableAccount:
          type: string
    Invoice:
      type: object
      required: [number, customer, date, currency, total, tax, settled, status, entryId]
      properties:
        number:
          type: string
          example: INV-2026-000001
        customer:
          type: string
        date:
          type: string
          format: date
        currency:
          type: string
        total:
          $ref: "#/components/schemas/Money"
        tax:
          $ref: "#/components/schemas/Money"
        settled:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [OPEN, PAID, VOID]
        entryId:
          type: string
          format: uuid
    Money:
      description: Amount as a decimal string with the currency code. Minor units are internal.
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          example: "1160.00"
        currency:
          type: string
          example: KES
    PartyInput:
      type: object
      required: [companyId, kind, name]
      properties:
        companyId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [CUSTOMER, SUPPLIER, BOTH]
        name:
          type: string
          maxLength: 160
        taxId:
          type: string
          maxLength: 40
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          nullable: true
    Party:
      type: object
      required: [id, companyId, kind, name, active]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [CUSTOMER, SUPPLIER, BOTH]
        name:
          type: string
        taxId:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        active:
          type: boolean
    ItemInput:
      type: object
      required: [companyId, code, name, unit]
      properties:
        companyId:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 160
        unit:
          type: string
          maxLength: 10
          example: EA
        revenueAccount:
          type: string
          nullable: true
    Item:
      type: object
      required: [companyId, code, name, unit, active]
      properties:
        companyId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        unit:
          type: string
        revenueAccount:
          type: string
          nullable: true
        active:
          type: boolean
    CreditNoteInput:
      type: object
      required: [companyId, date, receivableAccount, currency, lines]
      properties:
        companyId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        receivableAccount:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceLine"
    CreditNote:
      type: object
      required: [number, invoice, date, currency, total, tax, entryId]
      properties:
        number:
          type: string
          example: CN-2026-000001
        invoice:
          type: string
        date:
          type: string
          format: date
        currency:
          type: string
        total:
          $ref: "#/components/schemas/Money"
        tax:
          $ref: "#/components/schemas/Money"
        entryId:
          type: string
          format: uuid
    QuoteInput:
      type: object
      required: [companyId, customerId, date, currency, lines]
      properties:
        companyId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceLine"
    AcceptQuote:
      type: object
      required: [companyId, date, receivableAccount]
      properties:
        companyId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        receivableAccount:
          type: string
    Quote:
      type: object
      required: [number, customerId, customer, date, currency, total, tax, status]
      properties:
        number:
          type: string
          example: QUO-2026-000001
        customerId:
          type: string
          format: uuid
        customer:
          type: string
        date:
          type: string
          format: date
        currency:
          type: string
        total:
          $ref: "#/components/schemas/Money"
        tax:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [OPEN, ACCEPTED, CANCELLED]
        invoice:
          type: string
          nullable: true
    InvoiceTrace:
      type: object
      required: [invoice, creditNotes, steps]
      properties:
        invoice:
          $ref: "#/components/schemas/Invoice"
        creditNotes:
          type: array
          items:
            type: object
        steps:
          type: array
          items:
            type: object
            required: [kind, reference, entry]
            properties:
              kind:
                type: string
                enum: [ISSUE, PAYMENT, CREDIT_NOTE, VOID]
              reference:
                type: string
              entry:
                nullable: true
                type: object
                description: The ledger entry, with each line's account, side, amount and account name.
    ApprovalInput:
      type: object
      required: [companyId, kind, reason, payload]
      properties:
        companyId:
          type: string
          format: uuid
        kind:
          type: string
          pattern: "^[A-Z][A-Z_]{1,39}$"
          example: BOT_ACTION
        reason:
          type: string
          minLength: 10
          maxLength: 500
        payload:
          type: object
          additionalProperties: true
    ApprovalDecision:
      type: object
      required: [companyId]
      properties:
        companyId:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 500
    ApprovalRequest:
      type: object
      required: [id, companyId, kind, reason, payload, requestedBy, status, requestedAt]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        kind:
          type: string
        reason:
          type: string
        payload:
          type: object
          additionalProperties: true
        requestedBy:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, WITHDRAWN]
        requestedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
          format: uuid
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        decisionNote:
          type: string
          nullable: true
    Amount:
      type: object
      description: A money amount as a decimal string in its currency, such as "1234.50".
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: "^-?\\d+(\\.\\d+)?$"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    StockReceiptInput:
      type: object
      required: [companyId, warehouse, item, batchNo, qty, unitCost, date, reference, accounts]
      properties:
        companyId:
          type: string
          format: uuid
        warehouse:
          type: string
          maxLength: 60
        item:
          type: string
          maxLength: 60
        batchNo:
          type: string
          maxLength: 60
        expiresOn:
          type: string
          nullable: true
          description: Expiry date, YYYY-MM-DD. Required where the item policy asks for it.
        qty:
          type: string
          pattern: "^[1-9]\\d{0,17}$"
          description: Whole units as a decimal string.
        unitCost:
          type: string
          description: Cost per unit in the company currency, as a decimal string.
        date:
          type: string
          description: Receipt date, YYYY-MM-DD.
        reference:
          type: string
          maxLength: 100
        accounts:
          $ref: "#/components/schemas/StockAccounts"
    StockIssueInput:
      type: object
      required: [companyId, warehouse, item, qty, date, reference, accounts]
      properties:
        companyId:
          type: string
          format: uuid
        warehouse:
          type: string
          maxLength: 60
        item:
          type: string
          maxLength: 60
        qty:
          type: string
          pattern: "^[1-9]\\d{0,17}$"
        date:
          type: string
        reference:
          type: string
          maxLength: 100
        accounts:
          $ref: "#/components/schemas/StockAccounts"
    WriteOffInput:
      type: object
      required: [companyId, warehouse, item, date, reference, reason, accounts]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Why the stock is written off. Shown to the approver.
      properties:
        companyId:
          type: string
          format: uuid
        warehouse:
          type: string
          maxLength: 60
        item:
          type: string
          maxLength: 60
        date:
          type: string
        reference:
          type: string
          maxLength: 100
        accounts:
          $ref: "#/components/schemas/StockAccounts"
    StockAccounts:
      type: object
      description: The ledger accounts the movement posts to. Named by the caller, as receivables are for sales.
      required: [inventory, clearing, cogs, writeOff]
      properties:
        inventory:
          type: string
        clearing:
          type: string
        cogs:
          type: string
        writeOff:
          type: string
    StockBatch:
      type: object
      required: [id, companyId, warehouse, item, batchNo, receivedOn, receivedQty, balance, unitCost, receiptReference]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        warehouse:
          type: string
        item:
          type: string
        batchNo:
          type: string
        expiresOn:
          type: string
          nullable: true
        receivedOn:
          type: string
        receivedQty:
          type: string
        balance:
          type: string
          description: Units on hand, derived from the batch's movements.
        unitCost:
          $ref: "#/components/schemas/Amount"
        receiptReference:
          type: string
    StockResult:
      type: object
      required: [allocations, cost, entry]
      properties:
        allocations:
          type: array
          items:
            type: object
            required: [batchId, batchNo, qty, unitCost, cost]
            properties:
              batchId:
                type: string
                format: uuid
              batchNo:
                type: string
              expiresOn:
                type: string
                nullable: true
              qty:
                type: string
              unitCost:
                $ref: "#/components/schemas/Amount"
              cost:
                $ref: "#/components/schemas/Amount"
        cost:
          $ref: "#/components/schemas/Amount"
        entry:
          nullable: true
          type: object
          description: The ledger entry for the movement. Null when the stock had no value.
          properties:
            id:
              type: string
              format: uuid
            reference:
              type: string
            date:
              type: string
    ExpiryReport:
      type: object
      required: [asOf, expired, expiringSoon, expiredValue, expiringValue]
      properties:
        asOf:
          type: string
        expired:
          type: array
          items:
            $ref: "#/components/schemas/BatchStatus"
        expiringSoon:
          type: array
          items:
            $ref: "#/components/schemas/BatchStatus"
        expiredValue:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Cost of the balance still on hand in expired batches. Null when there are none.
        expiringValue:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Amount"
          description: Cost of the balance still on hand in batches expiring within the window. Null when there are none.
    BatchStatus:
      type: object
      required: [batch, daysLeft]
      properties:
        batch:
          $ref: "#/components/schemas/StockBatch"
        daysLeft:
          type: integer
          description: Days to expiry. Negative when the batch has already expired.
    PosSyncInput:
      type: object
      required: [companyId, accounts, sales]
      properties:
        companyId:
          type: string
          format: uuid
        accounts:
          type: object
          description: Cash, card and mobile money accounts, tax payable, and the stock accounts.
          required: [cash, card, mobile, taxPayable, inventory, clearing, cogs, writeOff]
          properties:
            cash:
              type: string
            card:
              type: string
            mobile:
              type: string
            taxPayable:
              type: string
            inventory:
              type: string
            clearing:
              type: string
            cogs:
              type: string
            writeOff:
              type: string
        sales:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/PosSaleInput"
    PosSaleInput:
      type: object
      required: [id, warehouse, date, currency, lines, tenders]
      properties:
        id:
          type: string
          format: uuid
          description: The UUID the device gave the sale. Syncing the same id twice stores it once.
        warehouse:
          type: string
        date:
          type: string
        currency:
          type: string
          description: Must be the company currency.
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemCode, qty, unitPrice, taxRateBps, taxMode, revenueAccount, tracked]
            properties:
              itemCode:
                type: string
              description:
                type: string
              qty:
                type: string
              unitPrice:
                type: string
                description: Price per unit before discount. Includes tax when taxMode is INCLUSIVE.
              discount:
                type: string
                description: Discount on the whole line. Applied before tax.
              taxRateBps:
                type: string
                description: Tax rate in basis points, such as 1900 for 19%.
              taxMode:
                type: string
                enum: [EXCLUSIVE, INCLUSIVE]
              revenueAccount:
                type: string
              tracked:
                type: boolean
                description: True for stock items, which are issued first to expire first.
        tenders:
          type: array
          minItems: 1
          items:
            type: object
            required: [method, amount]
            properties:
              method:
                type: string
                enum: [CASH, CARD, MOBILE]
              amount:
                type: string
    PosSyncResult:
      type: object
      required: [companyId, results]
      properties:
        companyId:
          type: string
          format: uuid
        results:
          type: array
          items:
            type: object
            required: [id, status, number, duplicate, reasons]
            properties:
              id:
                type: string
              status:
                type: string
                enum: [POSTED, NEEDS_REVIEW, REJECTED]
              number:
                type: string
                nullable: true
              duplicate:
                type: boolean
              reasons:
                type: array
                items:
                  type: string
    PosSale:
      type: object
      required: [id, status, number, warehouse, date, currency, total, tax, change, reasons, recordedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [POSTED, NEEDS_REVIEW]
        number:
          type: string
          nullable: true
        warehouse:
          type: string
        date:
          type: string
        currency:
          type: string
        subtotal:
          $ref: "#/components/schemas/Amount"
        tax:
          $ref: "#/components/schemas/Amount"
        total:
          $ref: "#/components/schemas/Amount"
        change:
          $ref: "#/components/schemas/Amount"
        cost:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Amount"
        tenders:
          type: array
          items:
            type: object
            properties:
              method:
                type: string
                enum: [CASH, CARD, MOBILE]
              amount:
                $ref: "#/components/schemas/Amount"
        reasons:
          type: array
          items:
            type: string
        recordedAt:
          type: string
          format: date-time
        billDiscount:
          $ref: "#/components/schemas/Amount"
        billDiscountReason:
          type: string
          nullable: true
        billDiscountApprovedBy:
          type: string
          nullable: true
        effectiveStatus:
          type: string
          enum: [POSTED, NEEDS_REVIEW, VOIDED]
          description: The status after any decision. The stored status does not change.
        resolution:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PosDecision"
    PosDecision:
      type: object
      required: [decision, decidedBy, decidedAt, reason, change, tenders]
      properties:
        decision:
          type: string
          enum: [POSTED, VOIDED]
        decidedBy:
          type: string
        decidedAt:
          type: string
          format: date-time
        reason:
          type: string
        postedOn:
          type: string
          nullable: true
        number:
          type: string
          nullable: true
        entryId:
          type: string
          format: uuid
          nullable: true
        cost:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Amount"
        change:
          $ref: "#/components/schemas/Amount"
        tenders:
          type: array
          items:
            type: object
            properties:
              method:
                type: string
                enum: [CASH, CARD, MOBILE]
              amount:
                $ref: "#/components/schemas/Amount"
    PosReviewInput:
      type: object
      required: [companyId, decision, reason, accounts]
      properties:
        companyId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [POST, VOID]
        reason:
          type: string
          minLength: 5
          maxLength: 500
        date:
          type: string
          description: POST only. The business date to post on, YYYY-MM-DD. Defaults to the sale's date, and must be in an open period.
        tenders:
          type: array
          description: POST only. The payments as reconciled. Defaults to the payments recorded with the sale.
          items:
            type: object
            required: [method, amount]
            properties:
              method:
                type: string
                enum: [CASH, CARD, MOBILE]
              amount:
                type: string
        billDiscountApprovalId:
          type: string
          format: uuid
          description: POST only. An approved POS_BILL_DISCOUNT request for this sale and this discount amount.
        discountApprovalAbove:
          type: string
          description: The bill discount threshold above which an approval is needed.
        accounts:
          type: object
          required: [cash, card, mobile, taxPayable, inventory, clearing, cogs, writeOff]
          properties:
            cash:
              type: string
            card:
              type: string
            mobile:
              type: string
            taxPayable:
              type: string
            inventory:
              type: string
            clearing:
              type: string
            cogs:
              type: string
            writeOff:
              type: string
            countVariance:
              type: string
    PosReviewResult:
      type: object
      required: [reasons]
      properties:
        sale:
          $ref: "#/components/schemas/PosSale"
        decision:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PosDecision"
        reasons:
          type: array
          items:
            type: string
    TransferInput:
      type: object
      required: [companyId, fromWarehouse, toWarehouse, item, qty, date, reference]
      properties:
        companyId:
          type: string
          format: uuid
        fromWarehouse:
          type: string
        toWarehouse:
          type: string
        item:
          type: string
        qty:
          type: string
          pattern: "^[1-9]\\d{0,17}$"
        date:
          type: string
        reference:
          type: string
          maxLength: 100
    TransferResult:
      type: object
      required: [transferred, allocations]
      properties:
        transferred:
          type: string
        allocations:
          type: array
          items:
            type: object
            required: [batchId, batchNo, qty, unitCost]
            properties:
              batchId:
                type: string
                format: uuid
              batchNo:
                type: string
              expiresOn:
                type: string
                nullable: true
              qty:
                type: string
              unitCost:
                $ref: "#/components/schemas/Amount"
    CountInput:
      type: object
      required: [companyId, warehouse, date]
      properties:
        companyId:
          type: string
          format: uuid
        warehouse:
          type: string
        date:
          type: string
          description: The date the count is taken. Adjustments are posted on this date.
    CountLineInput:
      type: object
      required: [companyId, batchId, counted]
      properties:
        companyId:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        counted:
          type: string
          pattern: "^\\d{1,18}$"
          description: Whole units counted, zero or more.
    CountSubmitInput:
      type: object
      required: [companyId, reason, accounts]
      properties:
        companyId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 10
          maxLength: 500
        accounts:
          $ref: "#/components/schemas/StockAccounts"
    CompanyBody:
      type: object
      required: [companyId]
      properties:
        companyId:
          type: string
          format: uuid
    StockCount:
      type: object
      required: [id, companyId, warehouse, date, status, lines]
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        warehouse:
          type: string
        date:
          type: string
        status:
          type: string
          enum: [OPEN, SUBMITTED, APPLIED, CANCELLED]
        lines:
          type: array
          items:
            type: object
            required: [batchId, batchNo, item, unitCost, counted]
            description: expected and variance are present only for reviewers, or once the count is no longer open.
            properties:
              batchId:
                type: string
                format: uuid
              batchNo:
                type: string
              item:
                type: string
              expiresOn:
                type: string
                nullable: true
              unitCost:
                $ref: "#/components/schemas/Amount"
              counted:
                type: string
                nullable: true
              expected:
                type: string
              variance:
                type: string
                nullable: true
    ImportReport:
      type: object
      required: [rows, applied, created, repeated, errors, totalQty, reconciliation]
      properties:
        rows:
          type: integer
        applied:
          type: boolean
          description: True when the rows were written. False for a dry run, or when any row failed.
        created:
          type: integer
          description: Rows that created new batches.
        repeated:
          type: integer
          description: Rows whose reference was already imported, so they were left as they were.
        errors:
          type: array
          items:
            type: object
            required: [row, message]
            properties:
              row:
                type: integer
                description: Number of the row in the file, not counting the header.
              message:
                type: string
        totalQty:
          type: string
        totalValue:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Amount"
        createdValue:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Amount"
        reconciliation:
          type: object
          required: [stockAccount, before, after, change, expected, reconciled]
          properties:
            stockAccount:
              type: string
            before:
              $ref: "#/components/schemas/Amount"
            after:
              $ref: "#/components/schemas/Amount"
            change:
              $ref: "#/components/schemas/Amount"
            expected:
              $ref: "#/components/schemas/Amount"
            reconciled:
              type: boolean
              description: True when the stock account moved by exactly the value of the batches created.
    PosPriceInput:
      type: object
      required: [companyId, warehouse, date, currency, lines, tenders]
      properties:
        companyId:
          type: string
          format: uuid
        warehouse:
          type: string
        date:
          type: string
        currency:
          type: string
          description: Must be the company currency.
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemCode, qty, unitPrice, taxRateBps, taxMode, revenueAccount, tracked]
            properties:
              itemCode:
                type: string
              description:
                type: string
              qty:
                type: string
              unitPrice:
                type: string
              discount:
                type: string
              taxRateBps:
                type: string
              taxMode:
                type: string
                enum: [EXCLUSIVE, INCLUSIVE]
              revenueAccount:
                type: string
              tracked:
                type: boolean
        tenders:
          type: array
          maxItems: 10
          description: May be empty while the cashier is still entering the payments.
          items:
            type: object
            required: [method, amount]
            properties:
              method:
                type: string
                enum: [CASH, CARD, MOBILE]
              amount:
                type: string
        billDiscount:
          type: object
          required: [amount, reason]
          properties:
            amount:
              type: string
            reason:
              type: string
            approvalId:
              type: string
              format: uuid
        discountApprovalAbove:
          type: string
          description: The bill discount threshold above which an approval is needed.
    PosPriceResult:
      type: object
      required: [currency, lines, billDiscount, subtotal, tax, total, tendered, change, problems]
      properties:
        currency:
          type: string
        lines:
          type: array
          items:
            type: object
            properties:
              itemCode:
                type: string
              description:
                type: string
              qty:
                type: string
              tracked:
                type: boolean
              unitPrice:
                $ref: "#/components/schemas/Amount"
              discount:
                $ref: "#/components/schemas/Amount"
              billDiscount:
                $ref: "#/components/schemas/Amount"
              net:
                $ref: "#/components/schemas/Amount"
              tax:
                $ref: "#/components/schemas/Amount"
              total:
                $ref: "#/components/schemas/Amount"
        billDiscount:
          $ref: "#/components/schemas/Amount"
        subtotal:
          $ref: "#/components/schemas/Amount"
        tax:
          $ref: "#/components/schemas/Amount"
        total:
          $ref: "#/components/schemas/Amount"
        tendered:
          $ref: "#/components/schemas/Amount"
        change:
          $ref: "#/components/schemas/Amount"
        problems:
          type: array
          description: Why the sale would go to review. Empty when it would post.
          items:
            type: string
