components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Invalid input parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthenticatedError:
      description: Authentication required or token expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Action not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimitedError:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION"
            message:
              type: string
              example: "Invalid request payload"
            details:
              type: array
              items:
                type: object
          required:
            - code
            - message
      required:
        - error

    LeadSubmission:
      type: object
      properties:
        name:
          type: string
          example: "Alex Vance"
        email:
          type: string
          format: email
          example: "alex@vancetools.com"
        company:
          type: string
          example: "Vance Tools Ltd"
        country:
          type: string
          example: "United States"
        interest:
          type: string
          enum: ["early_access", "demo", "partner", "trial"]
        industry:
          type: string
          example: "Manufacturing"
        message:
          type: string
        source:
          type: string
        slot:
          type: string
        timezone:
          type: string
        consent:
          type: boolean
          enum: [true]
        website:
          type: string
          description: "Honeypot field; must remain empty"
      required:
        - name
        - email
        - interest
        - consent

    SignUpRequest:
      type: object
      properties:
        workspace:
          type: string
          example: "apex-tools"
        companyName:
          type: string
          example: "Apex Precision Tools Ltd"
        country:
          type: string
          example: "US"
        currency:
          type: string
          example: "USD"
        name:
          type: string
          example: "Sarah Connor"
        email:
          type: string
          format: email
          example: "sarah@apexprecision.com"
        password:
          type: string
          format: password
        website:
          type: string
          description: "Honeypot field"
      required:
        - workspace
        - companyName
        - country
        - currency
        - name
        - email
        - password

    SignUpResponse:
      type: object
      properties:
        workspace:
          type: string
        tenantId:
          type: string
        company:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        session:
          $ref: "#/components/schemas/SessionInfo"
      required:
        - workspace
        - tenantId
        - company
        - session

    LoginRequest:
      type: object
      properties:
        tenantSlug:
          type: string
          example: "apex-tools"
        email:
          type: string
          format: email
          example: "sarah@apexprecision.com"
        password:
          type: string
          format: password
      required:
        - tenantSlug
        - email
        - password

    SessionInfo:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - token
        - expiresAt

    SessionResponse:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/SessionInfo"
        principal:
          $ref: "#/components/schemas/Principal"
      required:
        - session
        - principal

    Principal:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        email:
          type: string
        permissions:
          type: array
          items:
            type: string
      required:
        - id
        - tenantId
        - email
        - permissions

    WorkspaceTotals:
      type: object
      properties:
        cash:
          type: string
          example: "42150.00"
        revenue:
          type: string
          example: "128420.50"
        expenses:
          type: string
          example: "86270.50"
        profit:
          type: string
          example: "42150.00"
      required:
        - cash
        - revenue
        - expenses
        - profit

    MonthlyTrendRow:
      type: object
      properties:
        month:
          type: string
          example: "2026-11"
        revenue:
          type: string
          example: "23500.00"
        expenses:
          type: string
          example: "10100.00"
      required:
        - month
        - revenue
        - expenses

    WorkspaceOverview:
      type: object
      properties:
        company:
          type: object
          properties:
            name:
              type: string
            currency:
              type: string
        workspace:
          type: object
          properties:
            slug:
              type: string
        asOf:
          type: string
          format: date
        booksReady:
          type: boolean
        totals:
          $ref: "#/components/schemas/WorkspaceTotals"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyTrendRow"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/RecentEntry"
      required:
        - company
        - workspace
        - asOf
        - booksReady
        - totals
        - trend

    BotInsight:
      type: object
      properties:
        id:
          type: string
          example: "lou"
        name:
          type: string
          example: "Ledger Lou"
        role:
          type: string
          example: "Month-end checker"
        color:
          type: string
          example: "cyan"
        status:
          type: string
          enum: ["good", "watch", "act", "idle"]
        statusText:
          type: string
          example: "All good"
        foundText:
          type: string
        nextText:
          type: string
        hasDraft:
          type: boolean
        draftType:
          type: string
        draftLabel:
          type: string
        actionVerb:
          type: string
      required:
        - id
        - name
        - role
        - color
        - status
        - statusText
        - foundText
        - nextText

    WorkspaceInsights:
      type: object
      properties:
        company:
          type: string
        workspaceName:
          type: string
        currency:
          type: string
        asOf:
          type: string
        totals:
          $ref: "#/components/schemas/WorkspaceTotals"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyTrendRow"
        bots:
          type: array
          items:
            $ref: "#/components/schemas/BotInsight"
      required:
        - company
        - workspaceName
        - currency
        - asOf
        - totals
        - trend
        - bots

    QuickEntryRequest:
      type: object
      properties:
        kind:
          type: string
          enum: ["sale", "expense", "owner_investment", "customer_payment"]
        amount:
          type: string
          pattern: "^\\d{1,13}(\\.\\d{1,3})?$"
          example: "1250.00"
        date:
          type: string
          format: date
          example: "2026-11-14"
        account:
          type: string
          example: "4000"
        via:
          type: string
          enum: ["1000", "1100", "1200", "2000"]
          example: "1100"
        memo:
          type: string
          example: "Custom Machining Batch #42"
      required:
        - kind
        - amount
        - date
        - via

    QuickEntryResponse:
      type: object
      properties:
        reference:
          type: string
          example: "QE-2026-00042"
        date:
          type: string
        amount:
          type: string
      required:
        - reference

    Account:
      type: object
      properties:
        code:
          type: string
          example: "1100"
        name:
          type: string
          example: "Operating Bank Account"
        type:
          type: string
          enum: ["ASSET", "LIABILITY", "EQUITY", "REVENUE", "EXPENSE"]
        balance:
          type: string
          example: "42150.00"
      required:
        - code
        - name
        - type

    CreateAccountRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: ["ASSET", "LIABILITY", "EQUITY", "REVENUE", "EXPENSE"]
      required:
        - code
        - name
        - type

    JournalLine:
      type: object
      properties:
        account:
          type: string
        side:
          type: string
          enum: ["DEBIT", "CREDIT"]
        amount:
          type: string
      required:
        - account
        - side
        - amount

    JournalEntry:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
        date:
          type: string
          format: date
        memo:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JournalLine"
        reversalOf:
          type: string
      required:
        - id
        - reference
        - date
        - lines

    PostJournalRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        reference:
          type: string
        memo:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JournalLine"
      required:
        - date
        - lines

    TrialBalance:
      type: object
      properties:
        asOf:
          type: string
          format: date
        balanced:
          type: boolean
        debitTotal:
          type: string
        creditTotal:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
      required:
        - asOf
        - balanced
        - debitTotal
        - creditTotal
        - accounts

    RecentEntry:
      type: object
      properties:
        id:
          type: string
          example: "ENT-1049"
        date:
          type: string
          example: "2026-11-14"
        kind:
          type: string
          example: "Sale"
        description:
          type: string
          example: "Batch CNC Work"
        party:
          type: string
          example: "Delta Dynamics"
        amount:
          type: string
          example: "3450.00"
        status:
          type: string
          example: "posted"
      required:
        - id
        - date
        - kind
        - description
        - amount
        - status

    Party:
      type: object
      properties:
        id:
          type: string
          example: "01932940-1284-7a32-9842-192847583920"
        name:
          type: string
          example: "Delta Dynamics LLC"
        partyType:
          type: string
          enum: ["customer", "supplier", "both"]
        email:
          type: string
          example: "billing@deltadynamics.com"
        phone:
          type: string
          example: "+1 555-019-2831"
        taxId:
          type: string
          example: "US-8492019"
        status:
          type: string
          enum: ["active", "hold", "archived", "inactive"]
          example: "active"
        balance:
          type: string
          example: "3450.00"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - partyType
        - status
        - balance

    CreatePartyRequest:
      type: object
      properties:
        name:
          type: string
          example: "Delta Dynamics LLC"
        partyType:
          type: string
          enum: ["customer", "supplier", "both"]
        email:
          type: string
        phone:
          type: string
        taxId:
          type: string
        status:
          type: string
          enum: ["active", "hold", "archived", "inactive"]
        balance:
          type: string
      required:
        - name
        - partyType

    UpdatePartyRequest:
      type: object
      properties:
        name:
          type: string
        partyType:
          type: string
          enum: ["customer", "supplier", "both"]
        email:
          type: string
        phone:
          type: string
        taxId:
          type: string
        status:
          type: string
          enum: ["active", "hold", "archived", "inactive"]

    ProductItem:
      type: object
      properties:
        id:
          type: string
          example: "01932940-9912-7a11-8842-102938475619"
        sku:
          type: string
          example: "TOOL-CNC-01"
        name:
          type: string
          example: "Carbide End Mill 1/2 in 4-Flute"
        itemType:
          type: string
          enum: ["goods", "service", "bundle"]
          example: "goods"
        category:
          type: string
          example: "Tooling"
        unit:
          type: string
          example: "pcs"
        unitPrice:
          type: string
          example: "48.50"
        stockQuantity:
          type: integer
          example: 42
        reorderPoint:
          type: integer
          example: 20
        status:
          type: string
