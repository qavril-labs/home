  /v1/hrms/exit-cases/{id}/transitions:
    post:
      summary: Approve, rescind, or move an exit case to its next state (HRM-18). Termination needs the statutory checklist; the initiator cannot give final approval.
      operationId: hrmsTransitionExitCase
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
