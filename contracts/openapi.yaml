        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}
        "404": {$ref: "#/components/responses/NotFoundError"}
        "409": {$ref: "#/components/responses/ConflictError"}

  /v1/hrms/exit-cases/{id}/clearance-items/{itemId}:
    patch:
      summary: Clear or waive a clearance item (HRM-18). A waiver needs a reason and a different approver.
      operationId: hrmsUpdateClearanceItem
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: itemId, in: path, required: true, schema: {type: string}}
