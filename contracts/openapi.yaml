openapi: 3.1.0
info:
  title: QAVRIL LABS Platform API
  version: 1.1.0
  description: >
    The HTTP contract between the frontend web app/marketing site and the backend core services.
    Every figure on screen comes from these endpoints. Money amounts are always formatted decimal strings.

servers:
  - url: http://localhost:3002
    description: Local development API server
  - url: https://api.qavrillabs.com
    description: Production API

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                required:
                  - status

  /v1/public/leads:
    post:
      summary: Submit marketing site lead or demo request
      operationId: submitLead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadSubmission"
      responses:
        "201":
          description: Lead received successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "received"
                required:
                  - status
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /v1/public/signup:
    post:
      summary: Self-service workspace sign-up
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: Workspace provisioned and owner signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /v1/auth/login:
    post:
      summary: Sign in with workspace credentials
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /v1/auth/logout:
    post:
      summary: Sign out and invalidate current session
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Successfully signed out

  /v1/auth/forgot-password:
    post:
      summary: Request password reset email instructions (PLT-01)
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantSlug, email]
              properties:
                tenantSlug: {type: string}
                email: {type: string, format: email}
      responses:
        "200":
          description: Password reset request accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: {type: boolean}
                  message: {type: string}

  /v1/auth/reset-password:
    post:
      summary: Reset account password with one-time token (PLT-01)
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: {type: string}
                newPassword: {type: string, minLength: 8}
      responses:
        "200":
          description: Password successfully updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: {type: boolean}
                  message: {type: string}
        "401":
          $ref: "#/components/responses/UnauthenticatedError"

  /v1/me:
    get:
      summary: Get current authenticated principal and permissions
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal:
                    $ref: "#/components/schemas/Principal"
                required:
                  - principal
        "401":
          $ref: "#/components/responses/UnauthenticatedError"

  /v1/workspace/overview:
    get:
      summary: Get signed-in workspace dashboard figures, totals, and monthly trends
      operationId: getWorkspaceOverview
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Full workspace ledger overview and metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceOverview"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /v1/workspace/insights:
    get:
      summary: Get autonomous bot findings and draft actions for workspace
      operationId: getWorkspaceInsights
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Bot crew findings and recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInsights"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"

  /v1/workspace/starter-books:
    post:
      summary: Open starter chart of accounts and initial fiscal year
      operationId: setUpStarterBooks
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Books opened successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"

  /v1/workspace/quick-entries:
    post:
      summary: Post a double-entry journal transaction from plain user inputs
      operationId: postQuickEntry
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Optional. Send a unique key (8 to 128 letters, digits, dots, colons, dashes or underscores)
            per submission. A retry with the same key and body returns the first response; the same key
            with a different body returns 409.
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: "^[A-Za-z0-9._:-]{8,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickEntryRequest"
      responses:
        "201":
          description: Transaction recorded into ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickEntryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "409":
          description: The Idempotency-Key was used for a different request, or the first request is still running.

  /v1/master-data/parties:
    get:
      summary: List customers and suppliers (MDM-01)
      operationId: listParties
      security:
        - BearerAuth: []
      parameters:
        - name: partyType
          in: query
          schema:
            type: string
            enum: ["customer", "supplier", "both"]
        - name: status
          in: query
          schema:
            type: string
            enum: ["active", "hold", "archived", "inactive"]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Party listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Party"
    post:
      summary: Create a new customer or supplier
      operationId: createParty
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePartyRequest"
      responses:
        "201":
          description: Party created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "400":
          $ref: "#/components/responses/ValidationError"

  /v1/master-data/parties/{id}:
    get:
      summary: Get party details
      operationId: getParty
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Party details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
        "404":
          description: Party not found
    put:
      summary: Update party details
      operationId: updateParty
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePartyRequest"
      responses:
        "200":
          description: Party updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Party"
    delete:
      summary: Delete or archive party
      operationId: deleteParty
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Party deleted

  /v1/master-data/items:
    get:
      summary: List inventory items and goods/services catalog (MDM-02)
      operationId: listItems
      security:
        - BearerAuth: []
      parameters:
        - name: itemType
          in: query
          schema:
            type: string
            enum: ["goods", "service", "bundle"]
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Item listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductItem"
    post:
      summary: Create a catalog or inventory item
      operationId: createItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductItem"
        "400":
          $ref: "#/components/responses/ValidationError"

  /v1/master-data/items/{id}:
    get:
      summary: Get item details
      operationId: getItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductItem"
    put:
      summary: Update item details
      operationId: updateItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
      responses:
        "200":
          description: Item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductItem"
    delete:
      summary: Delete item
      operationId: deleteItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Item deleted

  /v1/master-data/accounts:
    get:
      summary: List chart of accounts (MDM-03)
      operationId: listMasterDataAccounts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      summary: Create an account in the chart of accounts
      operationId: createMasterDataAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /v1/master-data/accounts/{code}:
    put:
      summary: Update account name or status (MDM-03)
      operationId: updateMasterDataAccount
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                active:
                  type: boolean
              required:
                - name
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /v1/ledger/accounts:
    post:
      summary: Create a new account
      operationId: createAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /v1/ledger/journal-entries:
    get:
      summary: List ledger journal entries
      operationId: listEntries
      security:
        - BearerAuth: []
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Journal entry list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      summary: Post a balanced double-entry journal
      operationId: postJournalEntry
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Optional. A retry with the same key and body returns the first response instead of posting
            again; the same key with a different body returns 409.
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: "^[A-Za-z0-9._:-]{8,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostJournalRequest"
      responses:
        "201":
          description: Entry posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /v1/ledger/journal-entries/{id}/reverse:
    post:
      summary: Post an immutable reversal of a journal entry
      operationId: reverseJournalEntry
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Optional. A retry with the same key and body returns the first response instead of posting
            again; the same key with a different body returns 409.
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: "^[A-Za-z0-9._:-]{8,128}$"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                memo:
                  type: string
      responses:
        "201":
          description: Reversal entry posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /v1/ledger/trial-balance:
    get:
      summary: Retrieve trial balance as of date
      operationId: getTrialBalance
      security:
        - BearerAuth: []
      parameters:
        - name: asOf
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Trial balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialBalance"

  # ---- Banking & Reconciliation (FIN-04) ----
  /v1/banking/lines:
    get:
      summary: List bank feed lines with optional reconciliation status filter (FIN-04)
      operationId: getBankLines
      tags: ["Banking"]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, Unmatched, Suggested, Reconciled]
      responses:
        "200":
          description: List of bank feed lines
          content:
            application/json:
              schema:
                type: object
                required: [ok, lines]
                properties:
                  ok: {type: boolean}
                  lines:
                    type: array
                    items:
                      $ref: "#/components/schemas/BankFeedLine"

  /v1/banking/statements/import:
    post:
      summary: Import bank feed lines with auto-matching against invoices/bills (FIN-04)
      operationId: importBankStatement
      tags: ["Banking"]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    required: [postedDate, reference, description, amount, direction]
                    properties:
                      postedDate: {type: string, format: date}
                      reference: {type: string}
                      description: {type: string}
                      amount: {type: string}
                      direction: {type: string, enum: [IN, OUT]}
      responses:
        "201":
          description: Bank statement imported
          content:
            application/json:
              schema:
                type: object
                required: [ok, imported, ambiguous, lines]
                properties:
                  ok: {type: boolean}
                  imported: {type: integer}
                  ambiguous: {type: integer, description: "Lines where several documents fit. They stay unmatched; nothing is guessed."}
                  lines:
                    type: array
                    items:
                      $ref: "#/components/schemas/BankFeedLine"

  /v1/banking/reconcile:
    post:
      summary: Reconcile bank line with matched document reference (FIN-04)
      operationId: reconcileBankLine
      tags: ["Banking"]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lineId, matchedRef]
              properties:
                lineId: {type: string}
                matchedRef: {type: string}
      responses:
        "200":
          description: Bank line reconciled
          content:
            application/json:
              schema:
                type: object
                required: [ok, lineId, matchedRef, status]
                properties:
                  ok: {type: boolean}
                  lineId: {type: string}
                  matchedRef: {type: string}
                  status: {type: string, example: "Reconciled"}

  /v1/banking/unreconcile:
    post:
      summary: Unreconcile bank line back to unmatched status (FIN-04)
      operationId: unreconcileBankLine
      tags: ["Banking"]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lineId]
              properties:
                lineId: {type: string}
      responses:
        "200":
          description: Bank line reverted to unmatched
          content:
            application/json:
              schema:
                type: object
                required: [ok, lineId, status]
                properties:
                  ok: {type: boolean}
                  lineId: {type: string}
                  status: {type: string, example: "Unmatched"}

  /v1/banking/rules:
    get:
      summary: List bank reconciliation rules in the order they run (FIN-04)
      operationId: listBankRules
      tags: ["Banking"]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Rules ordered by priority
          content:
            application/json:
              schema:
                type: object
                required: [ok, rules]
                properties:
                  ok: {type: boolean}
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/BankRule"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      summary: Create a bank rule (FIN-04)
      operationId: createBankRule
      description: >
        Rules only suggest a match for one open invoice (money in) or bill (money out); they never
        reconcile or post. A name already in use returns 409. Needs fin.journal.post. Audited.
      tags: ["Banking"]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankRuleInput"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                type: object
                required: [ok, rule]
                properties:
                  ok: {type: boolean}
                  rule:
                    $ref: "#/components/schemas/BankRule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /v1/platform/leads:
    get:
      summary: List marketing leads for the platform workspace (B8)
      operationId: listPlatformLeads
      description: >
        Marketing leads are platform data, not tenant data. Only users of the platform workspace
        (PLATFORM_TENANT_ID) holding platform.leads.read may call this; every other tenant, including
        tenant admins, gets 403. Newest first. Includes contact details, so it is read-only and never cached.
      tags: ["Platform"]
      security:
        - BearerAuth: []
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: status, in: query, required: false, schema: {type: string, enum: [new, contacted, booked, closed]}}
      responses:
        "200":
          description: Leads, newest first
          content:
            application/json:
              schema:
                type: object
                required: [ok, leads]
                properties:
                  ok: {type: boolean}
                  leads:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformLead"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /v1/platform/leads/{id}/followup-drafts:
    post:
      summary: Save a follow-up draft for a lead (B8)
      operationId: createLeadFollowupDraft
      description: >
        Stores text for a person to review. It never sends anything (sending needs PLT-10). Refused with
        409 when the lead has not recorded consent, and 404 when the lead does not exist. Needs
        platform.leads.draft in the platform workspace. Audited.
      tags: ["Platform"]
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                subject: {type: string, minLength: 1, maxLength: 200}
                body: {type: string, minLength: 1, maxLength: 2000}
      responses:
        "201":
          description: Draft saved
          content:
            application/json:
              schema:
                type: object
                required: [ok, draft]
                properties:
                  ok: {type: boolean}
                  draft:
                    type: object
                    required: [id, leadId, subject, body, createdAt]
                    properties:
                      id: {type: string, format: uuid}
                      leadId: {type: string, format: uuid}
                      subject: {type: string}
                      body: {type: string}
                      createdAt: {type: string, format: date-time}
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /v1/banking/rules/{id}:
    put:
      summary: Replace a bank rule (FIN-04)
      operationId: updateBankRule
      tags: ["Banking"]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankRuleInput"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, rule]
                properties:
                  ok: {type: boolean}
                  rule:
                    $ref: "#/components/schemas/BankRule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    delete:
      summary: Delete a bank rule (FIN-04)
      operationId: deleteBankRule
      description: Lines already suggested keep the rule name they were suggested by. The deletion is audited.
      tags: ["Banking"]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Rule deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok, id]
                properties:
                  ok: {type: boolean}
                  id: {type: string, format: uuid}
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /v1/banking/rules/apply:
    post:
      summary: Run the rules again over lines that are not reconciled (FIN-04)
      operationId: applyBankRules
      description: >
        Re-evaluates lines that are Unmatched or Suggested. Reconciled lines never change.
        Repeating the call with no change in rules or documents changes nothing.
      tags: ["Banking"]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Counts from the run
          content:
            application/json:
              schema:
                type: object
                required: [ok, evaluated, suggested, ambiguous, unmatched, changed]
                properties:
                  ok: {type: boolean}
                  evaluated: {type: integer}
                  suggested: {type: integer}
                  ambiguous: {type: integer}
                  unmatched: {type: integer}
                  changed: {type: integer}
        "401":
          $ref: "#/components/responses/UnauthenticatedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  # ---- Bot API (UAAP agent service). Served by services/uaap, not apps/api. ----

  /v1/agents:
    get:
      summary: List the bots available to the caller
      operationId: listAgents
      description: >
        Returns the bots in service for the caller's tenant, with their purpose, example
        requests and out-of-scope items. Disabled bots are listed with enabled=false. A bot that
        needs specific permissions is listed only to callers who hold at least one of them (for
        example `lead-nurturing`, which is for the platform workspace); bots with no required
        permissions are listed to everyone. The service still checks permissions on every call.
      servers:
        - url: http://localhost:8090
          description: UAAP agent service (local development)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: Bots available to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
        "400":
          $ref: "#/components/responses/UaapError"
        "401":
          $ref: "#/components/responses/UaapUnauthenticatedError"

  /v1/agents/{agentId}/messages:
    post:
      summary: Send a message to a bot
      operationId: sendAgentMessage
      description: >
        Runs the bot on one message. The HTTP status is 200 for every outcome the bot reports;
        read `status` in the body to decide what to show. An approval is never executed by this
        call: a proposal waits in the approvals inbox until another person decides it. The
        approval token is never returned.
      servers:
        - url: http://localhost:8090
          description: UAAP agent service (local development)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            example: "universal-finance-agent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentMessageRequest"
      responses:
        "200":
          description: The bot's reply, including refusals and failures it reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentReply"
        "400":
          $ref: "#/components/responses/UaapError"
        "401":
          $ref: "#/components/responses/UaapUnauthenticatedError"
        "403":
          $ref: "#/components/responses/UaapError"
        "404":
          description: Unknown bot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UaapErrorResponse"

  /v1/approvals:
    get:
      summary: List the approvals inbox for the caller's tenant
      operationId: listApprovals
      description: >
        Proposals from bots, newest first. can_decide is false for the person who proposed the
        action: they can see it but cannot approve it.
      servers:
        - url: http://localhost:8090
          description: UAAP agent service (local development)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ApprovalStatus"
      responses:
        "200":
          description: Approvals in the caller's tenant
          content:
            application/json:
              schema:
                type: object
                required: [approvals]
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/UaapError"
        "401":
          $ref: "#/components/responses/UaapUnauthenticatedError"

  /v1/approvals/{approvalId}:
    get:
      summary: Read one proposal with the exact payload to review
      operationId: getApproval
      description: >
        Returns the payload and its payload_hash. Review the payload before deciding: the
        decision must send back the same hash.
      servers:
        - url: http://localhost:8090
          description: UAAP agent service (local development)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: The proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/UaapUnauthenticatedError"
        "404":
          description: Proposal not found in this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UaapErrorResponse"

  /v1/approvals/{approvalId}/decision:
    post:
      summary: Approve or reject a proposal
      operationId: decideApproval
      description: >
        Approve requires the payload_hash of the payload the approver reviewed. A mismatch is
        refused with VALIDATION and the proposal stays open. The approver must be a different
        person from the proposer and must hold the permission for the action; if not, the
        proposal stays open (FORBIDDEN), or is marked FAILED once the action has run. A decided
        proposal cannot be decided again (409).
      servers:
        - url: http://localhost:8090
          description: UAAP agent service (local development)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: Decision recorded. reply is the outcome of the approved action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionResponse"
        "400":
          $ref: "#/components/responses/UaapError"
        "401":
          $ref: "#/components/responses/UaapUnauthenticatedError"
        "403":
          $ref: "#/components/responses/UaapError"
        "404":
          description: Proposal not found in this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UaapErrorResponse"
        "409":
          description: Proposal already decided, or its approval was already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UaapErrorResponse"
        "410":
          description: Proposal expired before a decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UaapErrorResponse"

  /v1/events/tickets:
    post:
      summary: Issue a single-use ticket for one live event stream connection
      operationId: postEventTicket
      tags: ["Realtime"]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Ticket issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamTicket"
        "401":
          $ref: "#/components/responses/UnauthenticatedError"

