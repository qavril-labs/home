openapi: 3.0.3
info:
  title: QAVRIL LABS ERP API
  version: 0.2.0
  description: |
    Contract for the backend HTTP API. Claude Code writes this file; Antigravity reviews every change.
    Amounts are decimal strings in the company's currency. Business dates are YYYY-MM-DD.
    Errors use the body { "error": { "code", "message", "details" } }.
servers:
  - url: http://127.0.0.1:3002
paths:
  /v1/sales/invoices:
    post:
      summary: Issue a sales invoice (SAL-04)
      description: |
        Assigns the next INV-YYYY-NNNNNN number, posts receivables, income and tax to the ledger,
        and stores the invoice in one transaction. Needs permission sal.invoices.write and the
        FIN-01 and SAL-04 products enabled.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInvoice"
      responses:
        "201":
          description: Issued invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    get:
      summary: List invoices with money still owed
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Open invoices, oldest number first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/sales/invoices/{number}:
    get:
      summary: Get one invoice
      parameters:
        - $ref: "#/components/parameters/InvoiceNumber"
        - $ref: "#/components/parameters/CompanyId"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          $ref: "#/components/responses/Error"
  /v1/sales/invoices/{number}/payments:
    post:
      summary: Record a payment against an invoice
      description: |
        Debits the bank account and credits receivables. A payment above the amount outstanding
        is refused with the amount still owed in details.outstanding. Needs sal.invoices.pay.
      parameters:
        - $ref: "#/components/parameters/InvoiceNumber"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPayment"
      responses:
        "201":
          description: The invoice after the payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/sales/invoices/{number}/void:
    post:
      summary: Void an invoice that has no payments
      description: Posts a reversal of the invoice entry. Needs sal.invoices.void.
      parameters:
        - $ref: "#/components/parameters/InvoiceNumber"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidInvoice"
      responses:
        "200":
          description: The voided invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CompanyId:
      name: companyId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    InvoiceNumber:
      name: number
      in: path
      required: true
      schema:
        type: string
        maxLength: 60
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: NOT_LICENSED
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    IssueInvoice:
      type: object
      required: [companyId, customer, date, currency, receivableAccount, lines]
      properties:
        companyId:
          type: string
          format: uuid
        customer:
          type: string
          maxLength: 160
        date:
          type: string
          format: date
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        receivableAccount:
          type: string
          description: Ledger account code for receivables, for example 1200.
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceLine"
    InvoiceLine:
      type: object
      required: [description, revenueAccount, amount]
      properties:
        description:
          type: string
        revenueAccount:
          type: string
        amount:
          type: string
          description: Net amount of the line, positive, decimal string.
        taxAccount:
          type: string
          description: Required when tax is above zero.
        tax:
          type: string
          description: Tax on the line, zero or positive, decimal string.
    RecordPayment:
      type: object
      required: [companyId, date, amount, bankAccount, receivableAccount]
      properties:
        companyId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        amount:
          type: string
        bankAccount:
          type: string
        receivableAccount:
          type: string
    VoidInvoice:
      type: object
      required: [companyId, date, receivableAccount]
      properties:
        companyId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        receivableAccount:
          type: string
    Invoice:
      type: object
      required: [number, customer, date, currency, total, tax, settled, status, entryId]
      properties:
        number:
          type: string
          example: INV-2026-000001
        customer:
          type: string
        date:
          type: string
          format: date
        currency:
          type: string
        total:
          $ref: "#/components/schemas/Money"
        tax:
          $ref: "#/components/schemas/Money"
        settled:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [OPEN, PAID, VOID]
        entryId:
          type: string
          format: uuid
    Money:
      description: Amount as a decimal string with the currency code. Minor units are internal.
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          example: "1160.00"
        currency:
          type: string
          example: KES
