        budgetedAnnualCost: {$ref: "#/components/schemas/HrmsMoney"}
        currency: {type: string, minLength: 3, maxLength: 3}
        status: {$ref: "#/components/schemas/HrmsPositionStatus"}
        validFrom: {$ref: "#/components/schemas/HrmsDate"}
        validTo: {$ref: "#/components/schemas/HrmsDate", nullable: true}
    HrmsPositionInput:
      type: object
      required: [code, title, departmentId, approvedHeadcount, validFrom]
      properties:
        code: {type: string, maxLength: 32}
