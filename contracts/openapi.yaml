        "200":
          description: The exit case with the updated checklist
          content:
            application/json:
              schema: {type: object, required: [ok, exitCase], properties: {ok: {type: boolean}, exitCase: {$ref: "#/components/schemas/HrmsExitCase"}}}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}
        "404": {$ref: "#/components/responses/NotFoundError"}
        "409": {$ref: "#/components/responses/ConflictError"}

  /v1/hrms/exit-cases/{id}/settlement:
    get:
      summary: Full and final statement with every line sourced. A missing input returns status blocked and names it; nothing is estimated (HRM-18).
      operationId: hrmsGetSettlement
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The settlement
          content:
            application/json:
              schema: {type: object, required: [ok, settlement], properties: {ok: {type: boolean}, settlement: {$ref: "#/components/schemas/HrmsSettlement"}}}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}
        "404": {$ref: "#/components/responses/NotFoundError"}
    post:
      summary: Calculate the full and final settlement (HRM-18). Refused while clearance is incomplete.
      operationId: hrmsCalculateSettlement
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "201":
          description: The calculated settlement
          content:
            application/json:
              schema: {type: object, required: [ok, settlement], properties: {ok: {type: boolean}, settlement: {$ref: "#/components/schemas/HrmsSettlement"}}}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}
        "404": {$ref: "#/components/responses/NotFoundError"}
        "409": {$ref: "#/components/responses/ConflictError"}

  /v1/hrms/settlements/{id}/transitions:
    post:
      summary: Approve or pay a settlement (HRM-18). Approved settlements are immutable; a payment cannot repeat (idempotency key). Blocked settlements cannot be approved.
      operationId: hrmsTransitionSettlement
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HrmsTransition"}
      responses:
        "200":
          description: The settlement after the transition
          content:
            application/json:
              schema: {type: object, required: [ok, settlement], properties: {ok: {type: boolean}, settlement: {$ref: "#/components/schemas/HrmsSettlement"}}}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}
        "404": {$ref: "#/components/responses/NotFoundError"}
        "409": {$ref: "#/components/responses/ConflictError"}

  /v1/hrms/loans:
    get:
      summary: List loans and advances with outstanding balances (HRM-19)
      operationId: hrmsListLoans
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      parameters:
        - {name: employeeId, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/HrmsLoanStatus"}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema: {type: object, required: [ok, items], properties: {ok: {type: boolean}, items: {type: array, items: {$ref: "#/components/schemas/HrmsLoan"}}, nextCursor: {type: string, nullable: true}}}
        "401": {$ref: "#/components/responses/UnauthenticatedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}
    post:
      summary: Request a loan or advance (HRM-19). Over-limit requests route to a higher approver.
      operationId: hrmsCreateLoan
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      requestBody:
