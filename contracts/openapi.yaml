      summary: Reporting-line tree of positions and current holders (HRM-02)
      operationId: hrmsGetOrgChart
      tags: ["HRMS"]
      x-planned: true
      security:
        - BearerAuth: []
      parameters:
        - {name: asOf, in: query, required: false, schema: {$ref: "#/components/schemas/HrmsDate"}}
      responses:
        "200":
          description: Tree roots with children. Employee names are shown only where the caller may see them.
